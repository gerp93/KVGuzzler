openapi: 3.1.0
info:
  title: KVGuzzler house API
  version: 1.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: |
    The API of the always-on house server (`server/`, Go): whole-house and per-circuit power from the Refoss
    clamp monitors, smart plugs, and the PC pushed in by the KVGuzzler collector. The web dashboard (`web/`) and the
    Electron viewer (`shell/`) are its clients; the C# PC collector uses `POST /api/v1/ingest/pc`.

    **Versioning.** The contract has an integer major version, `api_version` (currently 1), sent by the server in the
    `X-KVG-Api-Version` header and in `GET /api/v1/status`, and by the PC collector in its ingest body. A client that
    sees a different major must stop and say which side needs updating. Adding optional fields or endpoints does not
    change the major; removing or re-typing anything does.

    **Rules every reading follows** (they mirror KVGuzzler's CLAUDE.md):
    - Everything about a device is read-only. This API never switches or configures a physical device.
    - Scopes are never summed across each other. `mains` is the whole house, `circuit` and `plug` are parts of it, and
      `pc` is the PC's own wall plug, which is a slice of some circuit already counted. Only readings of one scope
      are ever added together, and `house_watts` is the sum of the `mains` meters alone.
    - Money is a decimal string (`"12.34"`), never a number. Dates and times are RFC 3339 in UTC; "day" buckets and
      bill dates use the server's configured local time zone.
    - A reading above the sanity cap for its meter is dropped, not averaged; the drop is reported in `notes`.
servers:
  - url: http://house-box:8080
    description: The house server (host name and port are chosen at install time).
tags:
  - name: Read
    description: Current and historical readings, for the dashboard and the viewer.
  - name: Settings
    description: The server's own configuration (labels, devices, rates, carbon). Never changes a physical device.
  - name: Ingest
    description: Data pushed in by the PC collector.
security: []
paths:
  /api/v1/status:
    get:
      tags: [Read]
      operationId: getStatus
      summary: Server identity, versions and anything that needs attention.
      responses:
        '200':
          description: OK
          headers:
            X-KVG-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/devices:
    get:
      tags: [Read]
      operationId: listDevices
      summary: Every configured device and whether it answered recently.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
    post:
      tags: [Settings]
      operationId: addDevice
      summary: Start polling a device. Only a plain host or IP is accepted, never a URL or path.
      description: |
        The device is read once before anything is saved: one that does not answer like the kind named is refused with 502
        and nothing is kept. Adding a Refoss monitor answers 501 until its readings are mapped from a real answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDevice'
      responses:
        '201':
          description: Created. The server has already read the device once to learn its meters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: That device is already being polled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: This kind of device is not supported yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The device did not answer or did not look like the kind named.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/devices/{deviceId}:
    patch:
      tags: [Settings]
      operationId: updateDevice
      summary: Change a device's name or address (a plug that got a new one from the router).
      description: |
        A new address is read once first: if nothing answers there like the device did, nothing changes and the old address keeps being
        polled (502). The device keeps its id and its meters keep theirs, so their settings and their history stay what they were.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another device is already polled at that address.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Nothing at the new address answered like this device.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Settings]
      operationId: removeDevice
      summary: Stop polling a device. Its history is kept, it is just no longer counted live.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/meters:
    get:
      tags: [Read]
      operationId: listMeters
      summary: Every meter (a circuit, a mains leg, a plug, the PC) with its label.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [meters]
                properties:
                  meters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Meter'
  /api/v1/meters/{meterId}:
    patch:
      tags: [Settings]
      operationId: updateMeter
      summary: Rename a meter, switch it off, or (Refoss) flip its sign or pair its legs. Changes only the server's own settings, never the device.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterUpdate'
      responses:
        '200':
          description: The updated meter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/runs:
    get:
      tags: [Read]
      operationId: getMeterRuns
      summary: The times a meter was working over a period (a car charging, a dryer drying).
      description: |
        Found from the recorded minutes alone: a run is a stretch where the meter drew clearly more than it does at rest. A short dip inside a
        run does not end it and a blip of a minute or two is not a run. The level that counts as working is learned from the meter's last 30 days
        (so an hour is judged by the same level as a month) unless `min_watts` is given. A meter that barely changes has no such level
        (`threshold_watts` is null) and no runs. A run is listed in the period it starts in; the newest 500 are listed and `totals` counts all.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: min_watts
          in: query
          required: false
          description: Count a minute as working from this many watts up, instead of the learned level.
          schema:
            type: number
            exclusiveMinimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterRuns'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/levels:
    get:
      tags: [Read]
      operationId: getLevels
      summary: What each meter draws at rest and the level above which it is working, so a table of live readings can show which are working now.
      description: |
        Learned from each meter's last 30 days of recorded minutes, with the same working level the runs use (a quarter of the way from its
        median to its 99th percentile, never below 10 W). `rest_watts` is the middle of what it draws below that level. A meter that barely changes
        has no working level (`working_above_watts` is null): it is on, it never works, so it is always resting. A meter with under two hours
        recorded is left out. The answer is kept for a few minutes. Each meter's own, never added to anything.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Levels'
  /api/v1/meters/{meterId}/ev:
    get:
      tags: [Read]
      operationId: getMeterEv
      summary: A charging meter's odometer readings, with the miles, energy and cost per mile of each stretch between them.
      description: |
        For a meter marked `ev` (the circuit or plug that charges an electric vehicle). The user adds the car's odometer now and then; each
        stretch between two readings is the miles driven over the energy the meter used in the same days, priced at each local day's rate.
        A reading counts as taken at the start of its day. `coverage` says how much of a stretch the meter was measured (time a device did not
        answer is not credited, so a low figure means the cost per mile is too low). `since_last` is what the meter has used since the latest
        reading, which has no miles yet. 409 when the meter is not marked `ev`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterEv'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/ev/compare:
    get:
      tags: [Read]
      operationId: getEvCompare
      summary: The house's gasoline price area as a charging meter's vehicle is compared in it, and the owner's own gas car if there is one.
      description: |
        The comparison sets the cost of the electric vehicle's miles beside what the same miles would have cost in gasoline cars: the `presets` (15 to 40 miles
        per gallon) and, if the owner named one, `custom_mpg`. The price is the weekly average retail price of regular gasoline in an area, which EIA publishes
        for the country, regions, some states and big cities, read with the EIA key saved for the carbon footprint (`key_saved`). The area is the house's
        (`/api/v1/fuel-prices`), the same for every vehicle; only the own car is the vehicle's. Which of the gas cars a page draws is the page's own choice;
        every one is answered. 409 when the meter is not marked `ev`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvCompare'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Settings]
      operationId: putEvCompare
      summary: Save the owner's own gas car.
      description: |
        The presets are always compared; this adds one more. A `custom_mpg` that is one of the presets is not a second comparison. The price area is the house's
        (`PUT /api/v1/fuel-prices`): it must already be saved, or be named here as `area_id`, which saves it for the house and reads its prices now, as that
        call does. 400 for no area anywhere, a miles per gallon outside 5 to 200, an area EIA has no price for, or any other member (an older client's `mpg`
        included).
      parameters:
        - $ref: '#/components/parameters/MeterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                area_id:
                  type: string
                  description: One of the `areas` ids. Optional; saves the house's area.
                custom_mpg:
                  type: [number, 'null']
                  minimum: 5
                  maximum: 200
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvCompare'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: deleteEvCompare
      summary: Take the owner's own gas car off (the house's area and the saved prices are kept).
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/fuel-prices:
    get:
      tags: [Read]
      operationId: getFuelPrices
      summary: The house's price area for gasoline and diesel, and what was read for it.
      description: |
        Where the house is, as far as fuel prices go: one area for every vehicle. The weekly prices are EIA's, read with the EIA key saved for the carbon
        footprint (`key_saved`). `area_id` is null until chosen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelPrices'
    put:
      tags: [Settings]
      operationId: putFuelPrices
      summary: Save the house's price area, and read its prices now.
      description: |
        The area is kept even when the prices cannot be read (no EIA key yet, EIA not reachable): `last_outcome` says what happened and the server tries again.
        400 for an area EIA has no price for or any other member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area_id]
              additionalProperties: false
              properties:
                area_id:
                  type: string
                  description: One of the `areas` ids.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelPrices'
        '400':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: deleteFuelPrices
      summary: Take the area off, and with it every gas comparison (the prices already read are kept).
      responses:
        '204':
          description: Removed.
  /api/v1/meters/{meterId}/ev/battery:
    get:
      tags: [Read]
      operationId: getEvBattery
      summary: The battery's usable energy in kWh, as the owner set it.
      description: |
        It turns the car's battery percentages into energy, so what charging lost (the wall's energy less the battery's) can be worked out in `getEvCharges`.
        Ford's telemetry has a battery capacity member but this car leaves it empty, so the owner says it once, from the car's specification. Nothing is
        assumed: `kwh` is null until it is set and there are no loss figures. 409 when the meter is not marked `ev`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvBattery'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Settings]
      operationId: putEvBattery
      summary: Save the battery's usable energy.
      description: 400 for a figure outside 10 to 300 kWh.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kwh]
              additionalProperties: false
              properties:
                kwh:
                  type: number
                  minimum: 10
                  maximum: 300
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvBattery'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: deleteEvBattery
      summary: Take the battery's size off (the loss figures go with it).
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/ev/savings:
    get:
      tags: [Read]
      operationId: getEvSavings
      summary: What each stretch between odometer readings would have cost in each gas car, against what charging cost.
      description: |
        For each stretch of `getMeterEv` the miles are divided by each gas car's miles per gallon (`comparisons`) and priced at the average of the weekly prices
        over the stretch's days (a day takes the latest week on or before it, and the latest price after the last week). `savings` is a gas car's cost less the
        electric car's cost: negative when the electric car cost more. A stretch with a day before the first price kept, or with no electric cost, has no
        savings and is left out of `totals`, for every gas car alike. The electric cost is only the energy the meter measured, so charging elsewhere makes the
        savings look bigger. `configured` is false until a price area is chosen. 409 when the meter is not marked `ev`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvSavings'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/ev/charges:
    get:
      tags: [Read]
      operationId: getEvCharges
      summary: A charging meter's charges, newest first, each with its energy, cost and the battery's gain.
      description: |
        A charge is a stretch in which the meter drew power: the server opens one when the meter goes from resting to drawing (over 200 W on two
        looks in a row) and closes it when the meter has rested for two minutes, at the last moment it drew power. The energy and cost come from the
        meter's own minutes (priced at each local day's rate, so a corrected price follows); only the battery's charge comes from the car.
        `start_pct` is asked for when the charge begins, `end_pct` after it ends, until the car reports one made after the end (`end_pct_at`).
        `pct_status` says how the battery figures stand: `ok` (energy per percent given), `small_gain` (the battery gained under 2 percent, so there is
        nothing to divide by: preconditioning or a top-up), `waiting` (the car has not yet reported after the end), `early` (it only reported from
        before the end and the server gave up: the gain is short by the last of the charge, so no energy per percent), `none` (the start was never read),
        `active` (still charging). `consistency` covers the charges that are `ok`, null when there are none. The newest 200 are listed.
        409 when the meter is not marked `ev`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvCharges'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/ev/charges/{chargeId}:
    delete:
      tags: [Settings]
      operationId: deleteEvCharge
      summary: Remove a charge that should not be there.
      description: A charge still going is refused with 409, because the server would open it again. 404 when there is no such charge.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - name: chargeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/ev/odometer/{day}:
    put:
      tags: [Settings]
      operationId: putOdometer
      summary: Save the car's odometer on a day (replacing that day's reading).
      description: |
        An odometer only goes up: a reading below the one before it, or above the one after it, is refused (400). Answers like `getMeterEv`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - name: day
          in: path
          required: true
          description: A local calendar day, `2026-10-26`.
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [miles]
              additionalProperties: false
              properties:
                miles:
                  type: number
                  minimum: 0
                  maximum: 10000000
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterEv'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: deleteOdometer
      summary: Remove the odometer reading of a day.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - name: day
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/anomalies:
    get:
      tags: [Read]
      operationId: getAnomalies
      summary: The days the house, or a meter, used far more than it usually does.
      description: |
        A day is unusual when it is far above the middle (median) of the same kind of day, a weekday or a weekend day, over the four weeks before it,
        by three measures at once: at least 1.5 times as much, at least 3.5 typical swings above it, and at least a set amount more (1 kWh for the
        house, 0.3 kWh for a meter). With fewer than four such days before it, nothing is said. Only complete days up to yesterday are looked at.
        Without `meter_id` the answer is the house (the mains legs added) and every meter; a meter whose day is explained by something that holds it
        being unusual the same day is named as a cause of that day (`causes`, the meters inside it that were unusual and hold no unusual meter of their
        own), not listed again. Causes are already part of the figure and are never added to it. With `meter_id` it is that meter's own days.
      parameters:
        - name: days
          in: query
          required: false
          description: How many days back to look. Default 30, at most 90.
          schema:
            type: integer
            minimum: 1
            maximum: 90
        - name: meter_id
          in: query
          required: false
          description: Only this meter's unusual days.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anomalies'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/runs.csv:
    get:
      tags: [Read]
      operationId: exportMeterRunsCsv
      summary: A meter's runs over a period, as a CSV download.
      description: |
        One row per run (all of them, where the JSON answer lists the newest 500): start and end in the server's local time, minutes, kWh,
        average and peak watts, average and peak amps (blank when the meter reports no current) and the cost (blank when no price is known).
        Found the same way as `GET /meters/{meterId}/runs`, with the same `min_watts`.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: min_watts
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
      responses:
        '200':
          description: The CSV, sent as an attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/tree.csv:
    get:
      tags: [Read]
      operationId: exportTreeCsv
      summary: Every shown meter over a period, as a CSV download, in the order of the Hierarchy tab.
      description: |
        One row per meter: its label, id, type, scope, device, where it sits ("Garage panel > EV charger"), how many meters are directly inside it
        (`inside_count`), its energy, cost, highest power and current, its breaker and the hours it reported. A meter's own reading already contains
        the ones inside it, so the rows are never meant to be added: `inside_count` says which rows hold others. A label a spreadsheet could run as a
        formula is written as text.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The CSV, sent as an attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/meters/{meterId}/baseload:
    get:
      tags: [Read]
      operationId: getMeterBaseLoad
      summary: The power a meter never goes below over a period, its yearly cost and its share of what it uses.
      description: |
        The 5th percentile of the meter's minute averages (not the lowest minute: a dropout must not set it), with the average of the same
        minutes so the always-on share can be said. A year of it is priced at today's price. 204 when under an hour of minutes was recorded.
        A view of the meter's own reading: never added to any other meter's figure.
      parameters:
        - $ref: '#/components/parameters/MeterId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLoad'
        '204':
          description: Under an hour of minutes was recorded in the period.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/baseload:
    get:
      tags: [Read]
      operationId: getHouseBaseLoad
      summary: The power the whole house never goes below over a period.
      description: |
        Same as a meter's base load, for the mains legs added minute by minute (a minute where one leg is missing is left out, so the sum is
        never one leg short). 204 when no mains meter is shown or under an hour of minutes was recorded.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLoad'
        '204':
          description: Nothing to say yet.
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/live:
    get:
      tags: [Read]
      operationId: getLive
      summary: The latest reading of every enabled meter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /api/v1/series:
    get:
      tags: [Read]
      operationId: getSeries
      summary: A meter's power over a period, bucketed.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: meter_id
          in: query
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          required: false
          description: Defaults to the coarsest bucket that keeps the period under about 400 points.
          schema:
            $ref: '#/components/schemas/Bucket'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/history:
    get:
      tags: [Read]
      operationId: getHouseHistory
      summary: The house's energy over the rolling periods (hour, day, week, month, year, all time).
      description: "One row per period ending now: the mains' energy, its cost, highest draw and carbon. Empty when no mains meter is shown."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseHistory'
  /api/v1/estimate:
    get:
      tags: [Read]
      operationId: getHouseEstimate
      summary: What the cost estimator needs for the house.
      description: |
        Today's price per kWh, and what the house (the mains) really used per day over a window, counting every hour, averaged over the time
        actually recorded. `usage` is null when less than an hour has been recorded.
      parameters:
        - name: window
          in: query
          required: false
          description: How far back to average. Default 7d.
          schema:
            type: string
            enum: ['24h', '7d', '30d', all]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerEstimate'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/export.csv:
    get:
      tags: [Read]
      operationId: exportHouseCsv
      summary: The house's daily energy and cost over a period, as a CSV download.
      description: |
        One row per local day: the house (the mains), each circuit on its own, the day's cost of the house at that day's price (blank when no
        price is known), and its estimated CO2 once any grid intensity has been saved. A label a spreadsheet could run as a formula is written as text.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The CSV, sent as an attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/summary:
    get:
      tags: [Read]
      operationId: getSummary
      summary: Energy, cost and carbon per meter for a period, plus the house total.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/computers:
    get:
      tags: [Read]
      operationId: listComputers
      summary: Every computer, with the plugs tied to it.
      description: |
        A computer is its own kind of appliance: it can have a collector on it that reports its sensors and programs, one
        wall plug (the whole PC at the wall) and any number of peripheral plugs (monitor, speakers).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [computers]
                properties:
                  computers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Computer'
    post:
      tags: [Settings]
      operationId: addComputer
      summary: Add a computer by hand. A PC collector that reports for the first time is added by the server itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComputer'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computer'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another computer already uses that collector.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/computers/{computerId}:
    patch:
      tags: [Settings]
      operationId: updateComputer
      summary: Rename a computer or change which collector reports for it.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerUpdate'
      responses:
        '200':
          description: The updated computer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computer'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another computer already uses that collector.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Settings]
      operationId: removeComputer
      summary: Remove a computer. Its plugs stay as ordinary plugs; what its collector reported is kept.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/detail:
    get:
      tags: [Read]
      operationId: getComputerDetail
      summary: Everything about one computer for a period.
      description: |
        The whole PC at the wall, its peripherals, and what its collector reported about its insides (sensors, the programs it
        blames, the times it was not recording). The PC is on one of the circuits, so none of this is added to the house or
        circuit figures. "Setup" is the wall figure plus the peripherals, a separate, labelled figure for the whole desk.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/live:
    get:
      tags: [Read]
      operationId: getComputerLive
      summary: The latest look a computer's collector sent.
      description: |
        Just the PC's latest readings and per-program power, small enough to ask for every few seconds (the detail answer re-reads a whole
        period). 204 when no collector reports for this computer or none has sent a look yet.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PcLive'
        '204':
          description: No collector reports for this computer, or none has sent a look yet.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/series:
    get:
      tags: [Read]
      operationId: getComputerSeries
      summary: What each part of a computer drew over a period.
      description: |
        One line per sensor, one for the PC's own reading of its wall plug and one per meter it reads, bucketed like a meter's series,
        plus the stretches the collector was not recording so a chart can shade them. The lines are never added together. 204 when no
        collector reports for this computer or it has never reported.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: bucket
          in: query
          required: false
          description: Defaults to the coarsest bucket that keeps the period under about 400 points.
          schema:
            $ref: '#/components/schemas/Bucket'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PcSeries'
        '204':
          description: No collector reports for this computer, or it has never reported.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/history:
    get:
      tags: [Read]
      operationId: getComputerHistory
      summary: A computer's energy over the rolling periods (hour, day, week, month, year, all time).
      description: |
        One row per period ending now. With the computer's wall plug the headline is the whole PC at the wall; without one it is what its
        sensors measured. Each row also says how much of the sensors' measure that is, and how long nothing was being recorded (asleep, off,
        lost power), so nothing is silently missing.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerHistory'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/export.csv:
    get:
      tags: [Read]
      operationId: exportComputerCsv
      summary: A computer's daily energy and cost over a period, as a CSV download.
      description: |
        One row per local day: the whole PC at its wall plug (blank without one), what its sensors measured, a column for each plug next to
        it, and the day's cost of the PC and of those plugs at the price on that day (blank when no price is known). Numbers use a dot and no
        thousands separator. A label a spreadsheet could run as a formula is written as text.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The CSV, sent as an attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/estimate:
    get:
      tags: [Read]
      operationId: getComputerEstimate
      summary: What the cost estimator needs for a computer.
      description: |
        Today's price per kWh, and what the computer really used per day over a window, counting the time it was off or asleep. The whole
        PC at its wall plug is used if it recorded anything in the window, otherwise its sensors; it averages over the time actually
        recorded. `usage` is null when less than an hour has been recorded.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
        - name: window
          in: query
          required: false
          description: How far back to average. Default 7d.
          schema:
            type: string
            enum: ['24h', '7d', '30d', all]
        - name: peripherals
          in: query
          required: false
          description: |
            Comma-separated meter ids of the plugs next to the computer (monitor, speakers) to add to the usage. Ids that do not belong to
            the computer are ignored.
          schema:
            type: string
        - name: include_pc
          in: query
          required: false
          description: False to leave the PC out and average only the plugs named in `peripherals`. Default true.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerEstimate'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/groups:
    get:
      tags: [Read]
      operationId: listGroups
      summary: Every group, with its meters.
      description: |
        A group is a logical grouping of meters shown as one, for something that runs through more than one (an entertainment center
        on two power strips, a desk and its computer). It does not change where any of them is in the wiring: each meter still records
        its own energy. Any meter can be in a group except the mains, and a meter is in one group at a time.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplianceGroup'
    post:
      tags: [Settings]
      operationId: addGroup
      summary: Add an empty group. Put plugs in it with PATCH /meters/{id} group_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplianceGroup'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/groups/{groupId}:
    patch:
      tags: [Settings]
      operationId: renameGroup
      summary: Rename a group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplianceGroup'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: removeGroup
      summary: Remove a group. Its plugs stay, as ordinary plugs.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/groups/{groupId}/detail:
    get:
      tags: [Read]
      operationId: getGroupDetail
      summary: A group's energy and cost for a period, as one figure and by plug.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/database/growth:
    get:
      tags: [Read]
      operationId: getDatabaseGrowth
      summary: How the history database's size has changed, and what a month and a year of it come to.
      description: |
        The server notes the size of its database file every few hours (the nightly snapshots are copies of it, so they are never read). The estimate is a
        straight line through the readings of the last 14 days, given once they cover at least 3 days; it is read-only, and only an estimate (more meters,
        or a PC that reports its insides, make the real rate higher).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseGrowth'
  /api/v1/history-start:
    get:
      tags: [Settings]
      operationId: getHistoryStart
      summary: The day history starts on, if the owner set one.
      description: |
        A global cutoff: nothing recorded before that day is looked at by any period, not even "all time", and its start counts as the start of history.
        Nothing is deleted. It cuts the meters' minutes, the PC's, and the odometer readings and charges of an electric vehicle.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryStart'
    put:
      tags: [Settings]
      operationId: putHistoryStart
      summary: Start history on a day.
      description: 400 for something that is not a date, or a day in the future. The day is a day of the server's zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              additionalProperties: false
              properties:
                day:
                  type: string
                  format: date
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryStart'
        '400':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: deleteHistoryStart
      summary: Take the cutoff off, so all that was recorded is looked at again.
      responses:
        '204':
          description: Removed.
  /api/v1/rates:
    get:
      tags: [Settings]
      operationId: getRates
      summary: How the price of a kWh is worked out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateConfig'
    put:
      tags: [Settings]
      operationId: setRates
      summary: Replace the rate settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateConfig'
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateConfig'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/rates/lookup:
    get:
      tags: [Settings]
      operationId: lookupRates
      summary: Search OpenEI for the residential rates around an address or ZIP code.
      description: |
        Needs the OpenEI API key to be saved. Only rates in force now that can be priced per kWh by hour are returned, the likeliest first.
        Written from OpenEI's documented fields and not yet checked against the live service.
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffCandidates'
        '400':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/rates/tariff:
    get:
      tags: [Settings]
      operationId: getTariff
      summary: The looked-up tariff in use.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffInfo'
        '204':
          description: No tariff has been chosen.
  /api/v1/openei:
    get:
      tags: [Settings]
      operationId: getOpenEi
      summary: Whether an OpenEI API key is saved. Never returns the key.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenEiStatus'
    put:
      tags: [Settings]
      operationId: setOpenEi
      summary: Save, or with an empty key remove, the OpenEI API key.
      description: The key is kept on the server and sent to api.openei.org only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenEiKeyUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenEiStatus'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon:
    get:
      tags: [Settings]
      operationId: getCarbon
      summary: Carbon-footprint settings and the last outcome of the grid-intensity fetch. Never returns the key.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonConfig'
    put:
      tags: [Settings]
      operationId: setCarbon
      summary: Save the place and, optionally, a new EIA key. The key is write-only.
      description: |
        A reading is taken first, and the setup is only kept if it got one, so a wrong key or place is said so at once. A key left out keeps the
        saved one. The key is kept in a private file on the server, not in the database, and goes to EIA only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarbonUpdate'
      responses:
        '200':
          description: The saved settings (without the key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonConfig'
        '400':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: removeCarbon
      summary: Remove the key and place. The hours already saved are kept.
      responses:
        '204':
          description: Removed.
  /api/v1/ford:
    get:
      tags: [Settings]
      operationId: getFord
      summary: How the car's odometer is read from Ford, and what the last read said. Never returns the client secret or a token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordLink'
    put:
      tags: [Settings]
      operationId: setFord
      summary: Save the Ford developer application the odometer is read through, and the meter that charges the car.
      description: |
        The client ID and secret are the owner's own, from a personal application registered at developer.ford.com, and the owner's Ford password is
        never typed into this server. The secret is write-only and is kept in a private file on the server, not in the database; leave it out to keep
        the saved one. A new client ID, secret or token address makes the saved permission useless (the vehicle has to be linked again); the
        account-linking address, the unit and the meter keep it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FordUpdate'
      responses:
        '200':
          description: The saved setup (without the secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordLink'
        '400':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: removeFord
      summary: Remove the setup and the saved permission. The odometer readings already saved are kept.
      responses:
        '204':
          description: Removed.
  /api/v1/ford/link:
    post:
      tags: [Settings]
      operationId: startFordLink
      summary: Make the address the owner opens to sign in at Ford and agree to share the vehicle.
      description: |
        The address carries a fresh unpredictable `state`. The owner signs in on Ford's own page, and Ford sends the browser to the registered redirect
        address with a one-time `code` (valid 10 minutes). That address usually leads nowhere (a `localhost` redirect), and the owner pastes it into
        `completeFordLink`.
      responses:
        '200':
          description: The address to open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordLinkStart'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/ford/link/complete:
    post:
      tags: [Settings]
      operationId: completeFordLink
      summary: Finish linking with the address the browser was sent to after the owner agreed, and read the odometer once.
      description: |
        The address's `state` has to be the one `startFordLink` gave out (409 when none is waiting or it is over 15 minutes old, 400 when it differs or
        has no code). A code is single-use: after one was tried, the link has to be started again. 502 says what Ford refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FordLinkComplete'
      responses:
        '200':
          description: The setup and the first read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordLink'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/ford/read:
    post:
      tags: [Settings]
      operationId: readFord
      summary: Read the odometer from Ford now (the server also reads it by itself four times a day).
      description: |
        The odometer is saved as the reading of today's local day for the charging meter, unless it has not moved since the latest reading. Ford's
        own limit is one request per 30 seconds, so a read less than 30 seconds after the last look of any kind is refused with 429 without asking
        Ford (`read_wait_seconds` of the setup says how long is left). Ford's complaints are in the answer's `last_outcome`, not an error status.
      responses:
        '200':
          description: The setup and what the read said.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordLink'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/ford/probe:
    get:
      tags: [Settings]
      operationId: getFordProbe
      summary: What the last probe of Ford's endpoints said.
      responses:
        '200':
          description: The last probe, or an empty one (`checked_at` null, no results) when none was made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordProbe'
    post:
      tags: [Settings]
      operationId: probeFord
      summary: Ask every read-only Ford endpoint once and say what each answered.
      description: |
        Telemetry, garage, vehicle health alerts, charge schedules, departure times and the wallbox, and the charging-station activity when the wallbox
        lists a station. Only the names of the answers' fields are returned, and the values of those about the vehicle's kind, the battery, charging,
        schedules and alerts: never who the vehicle is or where it is. Nothing is saved but the answer. It is a look like any other, so inside the 30-second
        wait it is refused with 429 without asking Ford.
      responses:
        '200':
          description: What each endpoint said.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FordProbe'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/series:
    get:
      tags: [Read]
      operationId: getCarbonSeries
      summary: The house's carbon footprint over time, with the grid's carbon intensity.
      description: |
        For each hour (each local day over a period of more than about 16 days) the mains' energy at that stretch's grid intensity; an hour with no
        saved intensity is valued at the average of the hours that have one and counted in `estimated_kwh`. A stretch with an intensity and no energy is
        still listed, so the grid's line has no holes. Empty when there is no whole-house meter or no intensity was ever saved. It is the grid's average
        mix, never what one more kWh would cause.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonSeries'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/ingest/pc:
    post:
      tags: [Ingest]
      operationId: ingestPc
      summary: The PC collector pushes per-minute summaries. Safe to repeat.
      description: |
        Each reading is keyed by (`source_id`, `minute`, `name`); sending the same one again replaces it, so the
        collector can resend its whole outbox after a failure. Batches may arrive in any order.
        A body whose `api_version` differs from the server's is refused with 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PcIngest'
      responses:
        '200':
          description: Stored.
          headers:
            X-KVG-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/Problem'
        '426':
          description: The collector and the server speak different major versions of this contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  headers:
    ApiVersion:
      description: The contract's major version the server speaks.
      schema:
        type: integer
        const: 1
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ComputerId:
      name: computerId
      in: path
      required: true
      schema:
        type: string
    MeterId:
      name: meterId
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      description: Start of the period (inclusive), RFC 3339.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: End of the period (exclusive), RFC 3339.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: The request was refused; the body says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A short stable name, for example `host_not_plain`, `api_version_mismatch`.
        message:
          type: string
        server_api_version:
          type: integer
          description: Present on a version mismatch.
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,6})?$'
      description: An exact decimal amount in the configured currency.
    Scope:
      type: string
      description: |
        What a meter measures. Scopes are never summed across each other.
        `mains` is the whole house (one per measured leg; the house is their sum), `circuit` is one breaker, `plug` is one
        appliance on a smart plug, `pc` is the PC's own wall plug and is a slice of a circuit, never added to anything.
      enum: [mains, circuit, plug, pc]
    Bucket:
      type: string
      enum: [minute, hour, day]
    Status:
      type: object
      required: [api_version, server_version, time, notes]
      properties:
        api_version:
          type: integer
          const: 1
        server_version:
          type: string
        time:
          type: string
          format: date-time
        time_zone:
          type: string
          description: The IANA zone used for "day" buckets and bill dates.
        database_path:
          type: string
          description: Where the server keeps its history database (read-only; it is moved on the box, not from the dashboard).
        database_bytes:
          type: integer
          description: The size of the database file, without its write-ahead log.
        data_since:
          type: string
          format: date-time
          description: When anything was first recorded (a meter's or a PC's sensors'); absent while nothing is. The dashboard hides the periods longer than this.
        notes:
          type: array
          description: Plain-language things that need attention (a device stopped answering, a reading dropped).
          items:
            type: string
    DeviceUpdate:
      type: object
      minProperties: 1
      properties:
        host:
          type: string
          description: The new address, a plain host name or IP address only.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: The device's name. (A meter's own name is changed on the meter.)
    NewDevice:
      type: object
      required: [kind, host]
      properties:
        kind:
          type: string
          enum: [refoss, shelly_plug]
        host:
          type: string
          description: A plain host name or IP address only; a URL, path or port is refused.
        name:
          type: string
          maxLength: 60
          description: A label for the device (a plug's reading is named after this).
        scope:
          type: string
          enum: [plug, pc]
          description: |
            What a plug measures (`plug` when left out): `plug` is one appliance, `pc` is the PC's own wall plug. The PC's figure is a slice of a
            circuit already counted, so it is shown beside the others and added to nothing. Not allowed for a Refoss monitor
            (400): its inputs are circuits until set otherwise per meter.
    Device:
      type: object
      required: [id, kind, host, online]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [refoss, shelly_plug, pc]
        host:
          type: string
          description: Empty for `pc`, which pushes instead of being polled.
        name:
          type: string
        model:
          type: string
          description: As the device reports it, for example `em06p`.
        online:
          type: boolean
        last_seen:
          type: [string, 'null']
          format: date-time
    Meter:
      type: object
      required: [id, device_id, scope, label, enabled, type]
      properties:
        id:
          type: string
          description: Stable, and never contains a slash (it is used as a URL path segment), for example `refoss-em16p-1:ch-07`.
          pattern: '^[^/\s]+$'
        device_id:
          type: string
        index:
          type: [integer, 'null']
          description: The meter number on the device, when it has one.
        scope:
          $ref: '#/components/schemas/Scope'
        type:
          type: string
          enum: [house, sub_panel, circuit, device, computer]
          description: |
            What the meter is, as the user would name it: the whole `house`, a `sub_panel`'s feed (it holds other circuits), one `circuit`
            (breaker), a `device` (a plug), or a `computer` (the wall plug of a computer: it opens the computer's page, and the parts its
            collector reports (CPU, GPU, memory) are shown under it). Filled in by the server: a Refoss meter's is the user's choice, the rest follow
            from the scope (a PC's wall plug that belongs to a computer is a `computer`), and a circuit with circuits inside it is a sub-panel
            until told otherwise. It describes; the math still follows `scope`.
        label:
          type: string
          description: What the user calls it, for example "Dryer" or "EV charger".
        enabled:
          type: boolean
          description: A switched-off meter is not shown or counted but its history is kept.
        max_watts:
          type: [number, 'null']
          description: The sanity cap; a reading above it is dropped.
        computer_id:
          type: [string, 'null']
          description: The computer this plug belongs to, or null. Only `pc` and `plug` meters can belong to one.
        group_id:
          type: [string, 'null']
          description: The group this meter is in, or null. Any meter but the mains can be in one; a group is only a grouping and does not move it in the wiring.
        parent_id:
          type: [string, 'null']
          description: |
            The circuit this one is part of, or null. A circuit that feeds a sub-panel holds the circuits clamped inside that panel, and a plug
            says which circuit it is plugged into. The parent's own figure already contains its children's, so a parent and its children are never
            added together; what the parent has that none of them account for is the remainder. Any meter but `mains` can have one (a computer's wall
            plug and peripherals included: the circuit they are on).
        favorite:
          type: boolean
          description: The user marked it as one they want one click away; the live page offers it as a choice. Kept on the server so every device shows the same ones.
        invert:
          type: boolean
          description: Flip the sign of the reading, for a Refoss clamp put on backwards. Only a Refoss meter has it.
        pair_with:
          type: [string, 'null']
          description: |
            The meter of the other leg of the same 240 V breaker. This meter then reports both legs added, and that one is switched off and
            not reported on its own. Only a Refoss meter has it.
        breaker_amps:
          type: [number, 'null']
          description: |
            The size of the breaker this meter is on, in amps, as the user said; null when not said. Only used to say how much of the breaker a
            current is (the continuous-load rule keeps a load that runs for hours under 80% of it).
        ev:
          type: boolean
          description: "The user said this meter charges an electric vehicle: its page takes odometer readings (`getMeterEv`). Only a circuit or a plug can."
    OdometerReading:
      type: object
      required: [day, miles]
      properties:
        day:
          type: string
          format: date
        miles:
          type: number
    DatabaseGrowth:
      type: object
      required: [points, bytes_now, per_month_bytes, in_a_year_bytes, readings, basis_days]
      properties:
        points:
          type: array
          description: Every size recorded, oldest first.
          items:
            type: object
            required: [at, bytes]
            properties:
              at:
                type: string
                format: date-time
              bytes:
                type: integer
        bytes_now:
          type: [integer, 'null']
          description: The database file's size now, without its write-ahead log; null when the server does not know where the file is.
        per_month_bytes:
          type: [integer, 'null']
          description: The estimated growth in a month; null until the readings cover a few days.
        in_a_year_bytes:
          type: [integer, 'null']
          description: The size a year from now at that rate; null until `per_month_bytes` is.
        readings:
          type: integer
          description: How many readings the estimate rests on (those of the last 14 days).
        basis_days:
          type: [number, 'null']
          description: How many days those readings cover; null with fewer than two.
    HistoryStart:
      type: object
      required: [day, recorded_since]
      properties:
        day:
          type: [string, 'null']
          format: date
          description: The local day history starts on; null when history is not cut.
        recorded_since:
          type: [string, 'null']
          format: date-time
          description: The first moment anything was recorded, whatever the cutoff says, so the owner can see what a day would leave out; null when nothing was.
    EvBattery:
      type: object
      required: [meter_id, kwh]
      properties:
        meter_id:
          type: string
        kwh:
          type: [number, 'null']
          description: The battery's usable energy in kWh; null until the owner sets it.
    FuelPrices:
      type: object
      required: [area_id, area_name, areas, key_saved, last_check, last_outcome, latest_week, latest_price, latest_diesel_price, diesel_area_name]
      properties:
        area_id:
          type: [string, 'null']
          description: The house's price area; null until chosen.
        area_name:
          type: [string, 'null']
        areas:
          type: array
          description: The places EIA publishes a weekly gasoline price for.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        key_saved:
          type: boolean
          description: Whether the EIA key the prices need (saved in the Connectors tab) is there.
        last_check:
          type: [string, 'null']
          format: date-time
        last_outcome:
          type: [string, 'null']
          description: What the last read of the prices said, in words.
        latest_week:
          type: [string, 'null']
          description: The Monday of the newest week price kept.
        latest_price:
          type: [string, 'null']
          description: Dollars per gallon of regular gasoline, a decimal string.
        latest_diesel_price:
          type: [string, 'null']
          description: Dollars per gallon of No. 2 diesel in the newest week, a decimal string; null when diesel prices have not been read.
        diesel_area_name:
          type: [string, 'null']
          description: The area the diesel price is for. EIA publishes weekly diesel for the country, the regions and California only, so any other area's diesel is the price of the region it is in. Null until diesel prices have been read.
    EvCompare:
      description: A charging meter's comparison. It carries what the house's price area (`FuelPrices`) says, and the vehicle's own car.
      allOf:
        - $ref: '#/components/schemas/FuelPrices'
        - type: object
          required: [meter_id, custom_mpg, presets]
          properties:
            meter_id:
              type: string
            custom_mpg:
              type: [number, 'null']
              description: The owner's own gas car, in miles per gallon, beside the presets; null when there is none.
            presets:
              type: array
              description: The gas cars every vehicle is compared with, in miles per gallon, lowest first.
              items:
                type: number
    EvSavings:
      type: object
      required: [meter_id, configured, area_name, diesel_area_name, comparisons, prices, diesel_prices, stretches, totals, cost_estimated]
      properties:
        meter_id:
          type: string
        configured:
          type: boolean
        area_name:
          type: [string, 'null']
        diesel_area_name:
          type: [string, 'null']
          description: The area the diesel prices are for (the area's region when EIA publishes no diesel for the area itself); null until diesel prices have been read.
        comparisons:
          type: array
          description: The cars compared with, the gas cars lowest miles per gallon first (the presets and the owner's own if there is one) and then the diesel cars the same way, once diesel prices have been read. Every `gas` list below is in this order.
          items:
            type: object
            required: [fuel, mpg, custom]
            properties:
              fuel:
                type: string
                enum: [gas, diesel]
                description: What the car burns, and so which weekly price its miles are priced at.
              mpg:
                type: number
              custom:
                type: boolean
        prices:
          type: array
          description: The weekly prices from a little before the first odometer reading (the last half year when there are none), oldest first, for a chart.
          items:
            type: object
            required: [week, dollars]
            properties:
              week:
                type: string
                format: date
              dollars:
                type: string
        diesel_prices:
          type: array
          description: The weekly diesel prices over the same stretch of time as `prices`, oldest first; empty until they have been read.
          items:
            type: object
            required: [week, dollars]
            properties:
              week:
                type: string
                format: date
              dollars:
                type: string
        stretches:
          type: array
          description: One per pair of neighbouring odometer readings, oldest first.
          items:
            type: object
            required: [from_day, to_day, miles, gas_price, diesel_price, ev_cost, gas]
            properties:
              from_day:
                type: string
                format: date
              to_day:
                type: string
                format: date
              miles:
                type: number
              gas_price:
                type: [string, 'null']
                description: The average of the gasoline week prices over the stretch's days; null when a day has no price.
              diesel_price:
                type: [string, 'null']
                description: The same for diesel; null when a day has no price or diesel prices have not been read.
              ev_cost:
                type: [string, 'null']
                description: What the meter's energy cost, as in `getMeterEv`.
              gas:
                type: array
                description: One per comparison, in the comparisons' order.
                items:
                  type: object
                  required: [fuel, mpg, gallons, gas_cost, savings]
                  properties:
                    fuel:
                      type: string
                      enum: [gas, diesel]
                    mpg:
                      type: number
                    gallons:
                      type: number
                      description: What the gas car would have burned over the miles.
                    gas_cost:
                      type: [string, 'null']
                    savings:
                      type: [string, 'null']
                      description: Gas cost less electric cost, a decimal string, negative when the electric car cost more.
        totals:
          type: [object, 'null']
          description: The stretches that have both costs, added up; null when there are none.
          required: [stretches, miles, ev_cost, ev_cost_per_mile, gas]
          properties:
            stretches:
              type: integer
              description: How many stretches are added up, the same for every gas car.
            miles:
              type: number
            ev_cost:
              type: string
            ev_cost_per_mile:
              type: [string, 'null']
            gas:
              type: array
              description: One per comparison, in the comparisons' order.
              items:
                type: object
                required: [fuel, mpg, gallons, gas_cost, savings, gas_cost_per_mile]
                properties:
                  fuel:
                    type: string
                    enum: [gas, diesel]
                  mpg:
                    type: number
                  gallons:
                    type: number
                  gas_cost:
                    type: string
                  savings:
                    type: string
                  gas_cost_per_mile:
                    type: [string, 'null']
        cost_estimated:
          type: boolean
    EvCharges:
      type: object
      required: [meter_id, car_linked, charges, consistency, battery_kwh, losses, cost_estimated]
      properties:
        meter_id:
          type: string
        car_linked:
          type: boolean
          description: Whether the battery's charge can be read for this meter (Ford is set up for it and linked). Without it charges have energy and cost but no battery figures.
        charges:
          type: array
          description: Newest first.
          items:
            type: object
            required: [id, started_at, ended_at, active, duration_seconds, kwh, cost, cost_estimated, peak_watts, coverage, start_pct, start_pct_at, end_pct, end_pct_at, gain_pct, pct_status, kwh_per_pct, battery_kwh, loss_kwh, efficiency, loss_cost]
            properties:
              id:
                type: integer
              started_at:
                type: string
                format: date-time
              ended_at:
                type: [string, 'null']
                format: date-time
                description: The last moment the meter drew power; null while the charge goes on.
              active:
                type: boolean
              duration_seconds:
                type: integer
                description: From the start to the end (to now while the charge goes on).
              kwh:
                type: number
                description: What the meter used, counting the whole minutes the charge touched.
              cost:
                type: [string, 'null']
                description: A decimal string; null when no price is known.
              cost_estimated:
                type: boolean
              peak_watts:
                type: [number, 'null']
              coverage:
                type: number
                minimum: 0
                maximum: 1
                description: The share of the charge the meter was measured; a low figure means the energy is too low.
              start_pct:
                type: [number, 'null']
                description: The traction battery's charge the car reported when the charge began.
              start_pct_at:
                type: [string, 'null']
                format: date-time
                description: When the car reported it.
              end_pct:
                type: [number, 'null']
              end_pct_at:
                type: [string, 'null']
                format: date-time
              gain_pct:
                type: [number, 'null']
                description: The end report less the start report, whenever both exist (it may be short of the real gain; see `pct_status`).
              pct_status:
                type: string
                enum: [active, none, waiting, early, small_gain, ok]
              kwh_per_pct:
                type: [number, 'null']
                description: Energy at the wall for each percent the battery gained; given only when `pct_status` is `ok`.
              battery_kwh:
                type: [number, 'null']
                description: The energy that reached the battery, the gain times the battery's usable kWh. Null without the battery's size (`getEvBattery`), for a charge with no `kwh_per_pct`, or for one the meter measured under 95 percent of the time.
              loss_kwh:
                type: [number, 'null']
                description: What the wall gave that the battery did not take (the charger, the battery's heat, keeping the battery and cabin at temperature). Negative when the battery's size is too big for the numbers.
              efficiency:
                type: [number, 'null']
                description: The battery's energy over the wall's, 0 to 1 in a real charge; over 1 means the battery's size is too big.
              loss_cost:
                type: [string, 'null']
                description: The lost energy at the charge's own price, a decimal string; null with no price or a negative loss.
        consistency:
          type: [object, 'null']
          description: How steady the energy per percent is over the charges that are `ok`.
          required: [charges, kwh_per_pct, lowest, highest]
          properties:
            charges:
              type: integer
            kwh_per_pct:
              type: number
              description: Those charges' energy over their gain, so a big charge counts for more than a small one.
            lowest:
              type: number
            highest:
              type: number
        battery_kwh:
          type: [number, 'null']
          description: The battery's usable energy as the owner set it; null until set. The loss figures need it.
        losses:
          type: [object, 'null']
          description: What charging lost over the charges that have a loss figure; null when there are none.
          required: [charges, wall_kwh, battery_kwh, loss_kwh, efficiency, lowest, highest, loss_cost]
          properties:
            charges:
              type: integer
            wall_kwh:
              type: number
            battery_kwh:
              type: number
            loss_kwh:
              type: number
            efficiency:
              type: number
              description: The battery's energy over the wall's over all of those charges, so a big charge counts for more than a small one.
            lowest:
              type: number
              description: The lowest efficiency of a single charge.
            highest:
              type: number
            loss_cost:
              type: [string, 'null']
              description: The lost energy's price, a decimal string; null when a charge had no price.
        cost_estimated:
          type: boolean
    MeterEv:
      type: object
      required: [meter_id, readings, intervals, totals, since_last, cost_estimated]
      properties:
        meter_id:
          type: string
        readings:
          type: array
          description: The odometer readings, oldest first.
          items:
            $ref: '#/components/schemas/OdometerReading'
        intervals:
          type: array
          description: One per pair of neighbouring readings, oldest first.
          items:
            type: object
            required: [from_day, to_day, miles, kwh, cost, cost_per_mile, miles_per_kwh, coverage, cost_estimated, banked_pct, used_kwh, used_cost]
            properties:
              from_day:
                type: string
                format: date
              to_day:
                type: string
                format: date
              miles:
                type: number
              kwh:
                type: number
                description: What the meter used from the start of `from_day` to the start of `to_day`.
              cost:
                type: [string, 'null']
                description: The energy priced at each local day's rate, a decimal string; null when no price is known.
              cost_per_mile:
                type: [string, 'null']
                description: A decimal string; null with no price or no miles. Worked out from `used_cost` when there is one.
              miles_per_kwh:
                type: [number, 'null']
                description: Worked out from `used_kwh` when there is one.
              banked_pct:
                type: [number, 'null']
                description: >-
                  How much the traction battery's charge rose over the stretch (negative when it fell), when the car's reports say what it held at both
                  ends. Null when they do not.
              used_kwh:
                type: [number, 'null']
                description: >-
                  What the miles used: `kwh` less the energy that is still in the battery (`banked_pct` times the wall energy each percent has taken). Null
                  without `banked_pct`.
              used_cost:
                type: [string, 'null']
                description: The same, priced, a decimal string. Null without `banked_pct` or a price.
              coverage:
                type: number
                minimum: 0
                maximum: 1
                description: The share of the stretch the meter was measured.
              cost_estimated:
                type: boolean
        totals:
          type: [object, 'null']
          description: >-
            Every stretch added up; null until there are two readings. When some stretches have `used_kwh` only those are added up (`adjusted`), at what
            their miles used; the others charged energy in one stretch that was driven in another.
          required: [miles, kwh, cost, cost_per_mile, miles_per_kwh, adjusted, from_day]
          properties:
            miles:
              type: number
            kwh:
              type: number
            cost:
              type: [string, 'null']
            cost_per_mile:
              type: [string, 'null']
            miles_per_kwh:
              type: [number, 'null']
            adjusted:
              type: boolean
            from_day:
              type: [string, 'null']
              format: date
              description: The first stretch counted when `adjusted`; null otherwise.
        since_last:
          type: [object, 'null']
          description: What the meter has used since the latest reading; null with no readings.
          required: [from_day, kwh, cost, banked_pct, banked_kwh]
          properties:
            from_day:
              type: string
              format: date
            kwh:
              type: number
            cost:
              type: [string, 'null']
            banked_pct:
              type: [number, 'null']
              description: How much the battery's charge rose since the latest reading, when the car's reports cover the time.
            banked_kwh:
              type: [number, 'null']
              description: That rise in kWh at the wall (what went into the battery rather than into driving).
        cost_estimated:
          type: boolean
    MeterUpdate:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        enabled:
          type: boolean
        invert:
          type: boolean
          description: Refoss only. Flip the sign of the clamp's reading (a load reads positive when the clamp is the right way round).
        pair_with:
          type: [string, 'null']
          description: |
            Refoss only. The meter of the other leg of the same 240 V breaker (on the same monitor), or null to unpair. The two are then one
            circuit (this meter reports both legs added); the other leg is switched off. 409 when either is already part of a pair.
        favorite:
          type: boolean
          description: Mark the meter as a favorite (or not). Any meter can be one.
        type:
          type: string
          enum: [house, sub_panel, circuit]
          description: |
            Refoss only. What the meter is: a monitor on the main panel measures the `house`; one on a sub-panel measures `circuit`s, and a
            circuit that feeds a sub-panel is a `sub_panel`.
        parent_id:
          type: [string, 'null']
          description: |
            Put this meter inside a circuit (the feed of a sub-panel, or the circuit a plug is plugged into), or null to take it out. The parent
            must be a `circuit` and the meter anything but `mains`; neither may be the second leg of a pair. 409 when it would make a loop.
        computer_id:
          type: [string, 'null']
          description: |
            Tie the plug to a computer (its id), or null to let it go. A computer has at most one `pc` plug (its wall plug);
            any number of `plug` meters are its peripherals.
        group_id:
          type: [string, 'null']
          description: |
            Put the meter in a group (its id), or null to take it out. Any meter but the mains can be in a group (400 for the mains); a group
            is only a grouping, so it may also be a computer's plug or sit inside another meter.
        breaker_amps:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1000
          description: The size of the breaker the meter is on, in amps, or null to forget it.
        ev:
          type: boolean
          description: Whether the meter charges an electric vehicle (a circuit or a plug only; 400 for the mains). Turning it off keeps the odometer readings.
    Reading:
      type: object
      required: [meter_id, watts]
      properties:
        meter_id:
          type: string
        watts:
          type: number
        volts:
          type: [number, 'null']
          description: The voltage the reading is measured against. A 240 V pair reports its two legs added.
        amps:
          type: [number, 'null']
          description: The current. A 240 V pair carries the same current in both legs, so this is the larger leg's, never the two added.
    Live:
      type: object
      required: [time, readings, house_watts, notes]
      properties:
        time:
          type: string
          format: date-time
        readings:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        house_watts:
          type: [number, 'null']
          description: The sum of the `mains` readings only; null when no mains meter answered.
        notes:
          type: array
          items:
            type: string
    SeriesPoint:
      type: object
      required: [t, avg_watts, max_watts, kwh]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the bucket.
        avg_watts:
          type: number
        max_watts:
          type: number
        kwh:
          type: number
        max_amps:
          type: [number, 'null']
          description: The highest current in the bucket (a 240 V pair's is the larger leg's); null for a meter that reports none.
    CarbonPoint:
      type: object
      required: [t, kwh, carbon_g, estimated_kwh, grid_g_per_kwh]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the stretch.
        kwh:
          type: number
        carbon_g:
          type: number
          description: Grams of CO2e (an average-grid estimate).
        estimated_kwh:
          type: number
          description: The part of the energy valued at an average because its own hour had no saved intensity.
        grid_g_per_kwh:
          type: [number, 'null']
          description: The average of the intensities saved for the stretch's hours; null when none was saved.
    CarbonSeries:
      type: object
      required: [bucket, points, grid_average_g_per_kwh]
      properties:
        bucket:
          type: string
          enum: [hour, day]
        grid_average_g_per_kwh:
          type: [number, 'null']
          description: The grid's average intensity over the period, the figure an hour with none of its own is valued at; null when the series is empty because there is no whole-house meter or no intensity was ever saved.
        points:
          type: array
          items:
            $ref: '#/components/schemas/CarbonPoint'
    Series:
      type: object
      required: [meter_id, bucket, points]
      properties:
        meter_id:
          type: string
        bucket:
          $ref: '#/components/schemas/Bucket'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    Levels:
      type: object
      required: [meters, from, to]
      properties:
        meters:
          type: array
          items:
            type: object
            required: [meter_id, rest_watts, working_above_watts, minutes]
            properties:
              meter_id:
                type: string
              rest_watts:
                type: number
                description: The middle of what the meter draws while resting.
              working_above_watts:
                type: [number, 'null']
                description: A minute at or above this counts as working; null for a meter that barely changes (always resting).
              minutes:
                type: integer
                description: How many recorded minutes the levels were learned from.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    BaseLoad:
      type: object
      required: [scope, watts, avg_watts, share, minutes, kwh_per_year, cost_per_year, rate, rate_estimated, from, to]
      properties:
        scope:
          type: string
          enum: [house, meter]
        meter_id:
          type: string
        watts:
          type: number
          description: The 5th percentile of the minute averages, the power it hardly ever goes below.
        avg_watts:
          type: number
          description: The average of the same minutes.
        share:
          type: number
          description: The part (0 to 1) of what it uses that is always on.
        minutes:
          type: integer
          description: How many recorded minutes the figure rests on.
        kwh_per_year:
          type: number
        cost_per_year:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: A year of that power at today's price; null when no price is known.
        rate:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Today's price per kWh that the yearly cost used.
        rate_estimated:
          type: boolean
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        parts:
          type: array
          description: |
            House only: the always-on power of the meters that hold no other meter (the fridge, the workshop, the desk PC), biggest first, at
            most 8. Each is that meter's own floor; they are never added to the house's or to each other, because the lowest minutes of
            different meters need not coincide.
          items:
            $ref: '#/components/schemas/BaseLoadPart'
    AnomalyCause:
      type: object
      required: [meter_id, label, extra_kwh]
      properties:
        meter_id:
          type: string
        label:
          type: string
        extra_kwh:
          type: number
          description: How much more than its own usual that meter used that day.
    AnomalyDay:
      type: object
      required: [date, meter_id, label, kwh, usual_kwh, extra_kwh, extra_cost, ratio, causes]
      properties:
        date:
          type: string
          format: date
          description: The local day.
        meter_id:
          type: [string, 'null']
          description: The meter whose day it was; null for the whole house.
        label:
          type: string
        kwh:
          type: number
        usual_kwh:
          type: number
          description: The median of the same kind of day (weekday or weekend) over the four weeks before.
        extra_kwh:
          type: number
        extra_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: The extra energy at that day's price; null when no price is known.
        ratio:
          type: number
          description: kwh over usual_kwh; 0 when the usual is nothing.
        causes:
          type: array
          description: At most three, the biggest first.
          items:
            $ref: '#/components/schemas/AnomalyCause'
    Anomalies:
      type: object
      required: [from, to, days]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: The last complete day looked at (yesterday).
        days:
          type: array
          description: Newest day first, the biggest extra first within a day.
          items:
            $ref: '#/components/schemas/AnomalyDay'
    BaseLoadPart:
      type: object
      required: [meter_id, label, watts, kwh_per_year, cost_per_year]
      properties:
        meter_id:
          type: string
        label:
          type: string
        watts:
          type: number
        kwh_per_year:
          type: number
        cost_per_year:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    MeterRun:
      type: object
      required: [start, end, minutes, kwh, avg_watts, peak_watts, avg_amps, peak_amps, cost]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: The end of the last working minute.
        minutes:
          type: integer
          description: From the first to the last working minute, the short dips inside it included.
        kwh:
          type: number
          description: Every recorded minute from the first working one to the last, the dips inside it included.
        avg_watts:
          type: number
        peak_watts:
          type: number
        avg_amps:
          type: [number, 'null']
          description: The current over the run, weighted by the time it was reported; null when the meter reports none.
        peak_amps:
          type: [number, 'null']
          description: The highest minute's current; null when the meter reports none.
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: The run's energy at the price of the local day it started; null when no price is known.
    MeterRunTotals:
      type: object
      required: [count, kwh, cost, minutes, longest_minutes, peak_watts]
      description: Over every run that starts in the period, also those past the listed 500.
      properties:
        count:
          type: integer
        kwh:
          type: number
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Null unless every run has a price.
        minutes:
          type: integer
          description: The runs' minutes added.
        longest_minutes:
          type: integer
        peak_watts:
          type: number
    MeterRuns:
      type: object
      required: [meter_id, threshold_watts, meter_kwh, runs, totals, truncated, cost_estimated, from, to]
      properties:
        meter_id:
          type: string
        threshold_watts:
          type: [number, 'null']
          description: The level above which a minute counts as working; null for a meter that barely changes.
        meter_kwh:
          type: number
          description: Everything the meter used over the period, so the runs' share of it can be said.
        runs:
          type: array
          description: Newest first, at most 500.
          items:
            $ref: '#/components/schemas/MeterRun'
        totals:
          $ref: '#/components/schemas/MeterRunTotals'
        truncated:
          type: boolean
        cost_estimated:
          type: boolean
          description: True when any run was priced at an estimated price (a day after the latest bill).
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    MeterSummary:
      type: object
      required: [meter_id, scope, kwh]
      properties:
        meter_id:
          type: string
        computer_id:
          type: [string, 'null']
          description: The computer the meter belongs to, so a client can group it with that computer instead of listing it alone.
        group_id:
          type: [string, 'null']
          description: The group the meter is in, so a client can show the group's total as one line.
        scope:
          $ref: '#/components/schemas/Scope'
        kwh:
          type: number
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        carbon_g:
          type: [number, 'null']
          description: Grams of CO2e, an average-grid estimate (always shown as approximate). Each hour's energy at that hour's grid intensity; null when no intensity has ever been saved.
        carbon_estimated_kwh:
          type: [number, 'null']
          description: The part of the energy whose carbon was worked out at an average because its own hour had no saved intensity.
        peak_watts:
          type: [number, 'null']
        min_watts:
          type: [number, 'null']
          description: The lowest average of a whole minute in the period (a minute with under half of it recorded does not count); null when there is none.
        peak_amps:
          type: [number, 'null']
          description: The highest current in the period; null when the meter reports none. For a 240 V pair it is the larger leg's, never the two added.
        monitored_hours:
          type: number
          description: Hours inside the period in which this meter actually reported.
    Summary:
      type: object
      required: [from, to, meters, house_kwh]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterSummary'
        house_kwh:
          type: [number, 'null']
          description: Energy of the `mains` meters only; null when there is none.
        house_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        unmetered_kwh:
          type: [number, 'null']
          description: |
            `house_kwh` minus the energy of the enabled top-level `circuit` meters (those with no `parent_id`, or whose parent is not
            shown), never below zero: what no circuit clamp accounts for. A circuit inside a sub-panel's feed is part of the feed's figure
            and is not taken off a second time. Derived, so shown as its own row and never added to anything.
        cost_estimated:
          type: boolean
          description: |
            True when any part of a cost in this summary was priced by estimate: a day after the latest bill or in a gap
            between bills uses the most recent bill's price until the next bill is entered. Show such costs as approximate.
        carbon_estimated_share:
          type: [number, 'null']
          description: The share (0 to 1) of the carbon figure that rests on an estimated, not measured, grid intensity.
        house_peak_watts:
          type: [number, 'null']
          description: "The mains meters' highest draws added. An upper bound: the legs need not peak in the same second."
        house_min_watts:
          type: [number, 'null']
          description: The least the mains meters drew together in any whole minute (the legs added minute by minute, never their lowest minutes added); null when there is none.
        house_carbon_g:
          type: [number, 'null']
          description: The mains meters' carbon added (grams of CO2e, an average-grid estimate); null when no intensity has ever been saved.
        house_carbon_estimated_kwh:
          type: [number, 'null']
          description: The part of the house's energy whose carbon was worked out at an average because its own hour had no saved intensity.
    HouseHistoryPeriod:
      type: object
      required: [key, label, from, to, kwh, cost_estimated]
      properties:
        key:
          type: string
          enum: ['1h', '24h', '7d', '30d', '1y', all]
        label:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        kwh:
          type: number
          description: The `mains` meters' energy only.
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        cost_estimated:
          type: boolean
        peak_watts:
          type: [number, 'null']
          description: An upper bound (the mains legs' peaks added).
        carbon_g:
          type: [number, 'null']
        carbon_estimated_kwh:
          type: [number, 'null']
    HouseHistory:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          description: Empty when no mains meter is shown.
          items:
            $ref: '#/components/schemas/HouseHistoryPeriod'
    RateMode:
      type: string
      enum: [one, bills, lookup]
    FixedFee:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
          maxLength: 60
        amount:
          $ref: '#/components/schemas/Money'
    Bill:
      type: object
      required: [start, end, total, kwh]
      properties:
        start:
          type: string
          format: date
          description: First local day the bill covers.
        end:
          type: string
          format: date
          description: Last local day the bill covers. Two bills may not share a day.
        total:
          $ref: '#/components/schemas/Money'
        fixed_fees:
          type: array
          description: |
            Charges on the bill that do not depend on use (a basic service charge, a credit as a negative amount). They are
            left out when the price per kWh is worked out: (total minus these) / kwh.
          items:
            $ref: '#/components/schemas/FixedFee'
        kwh:
          type: number
          exclusiveMinimum: 0
    RateConfig:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/RateMode'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        fixed_rate:
          $ref: '#/components/schemas/Money'
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        tariff_label:
          type: [string, 'null']
          description: The looked-up tariff in use (lookup mode); the rate grid itself is kept server-side.
    OpenEiStatus:
      type: object
      required: [has_key]
      properties:
        has_key:
          type: boolean
    OpenEiKeyUpdate:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: Letters, digits, dashes and underscores, 8 to 128 of them; empty removes the saved key.
    TariffInfo:
      type: object
      required: [label, utility, name, fetched_at, summary, cheapest, dearest, varies_by_time, periods, tiers]
      description: |
        A utility's published tariff reduced to an energy price per kWh for each month, kind of day and hour (the grid stays on the server). The
        energy charge only: the first tier's rate plus its adjustment and the month's fuel adjustment. Fixed and demand charges are left out.
      properties:
        label:
          type: string
          description: The rate's label in the OpenEI Utility Rate Database.
        utility:
          type: string
        name:
          type: string
        uri:
          type: [string, 'null']
        fetched_at:
          type: string
          format: date-time
        summary:
          type: string
        cheapest:
          type: number
        dearest:
          type: number
        varies_by_time:
          type: boolean
        periods:
          type: integer
        tiers:
          type: integer
          description: The most usage tiers any period has; only the first tier is used.
        fixed_charge:
          type: [string, 'null']
    TariffCandidate:
      allOf:
        - $ref: '#/components/schemas/TariffInfo'
        - type: object
          required: [is_default, approved]
          properties:
            is_default:
              type: boolean
              description: OpenEI marks it as the most common rate for its sector and service type.
            approved:
              type: boolean
              description: An OpenEI expert has checked it.
    TariffCandidates:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/TariffCandidate'
    CarbonConfig:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a key is saved. The key itself is never returned.
        place:
          type: string
          description: The balancing authority's code (like MISO). The grid's carbon intensity comes from the US EIA's hourly generation by fuel.
        last_outcome:
          type: [string, 'null']
          description: What the last fetch said, in plain language.
        last_fetch:
          type: [string, 'null']
          format: date-time
        last_grams:
          type: [number, 'null']
          description: The latest intensity read, in grams of CO2e per kWh.
        last_hour:
          type: [string, 'null']
          format: date-time
          description: The hour that reading is for.
    CarbonUpdate:
      type: object
      properties:
        place:
          type: string
          description: The balancing authority's code, like MISO.
        key:
          type: string
          writeOnly: true
          description: Omit to keep the saved key.
    FordLink:
      type: object
      required: [configured, linked, needs_link, last_check, last_outcome, last_raw, last_found, last_miles, last_day]
      properties:
        configured:
          type: boolean
          description: Whether a client ID, secret and the addresses are saved. The secret itself is never returned.
        linked:
          type: boolean
          description: Whether the owner has agreed to share the vehicle (a refresh token is held).
        needs_link:
          type: boolean
          description: The saved permission is gone (expired, revoked or never given), so the vehicle has to be linked again. Nothing is asked of Ford until then.
        client_id:
          type: string
        authorize_url:
          type: string
          description: The account-linking address copied from the developer dashboard.
        token_url:
          type: string
        odometer_unit:
          type: string
          enum: [km, miles]
          description: What Ford's odometer is in, as the owner chose it.
        meter_id:
          type: string
          description: The charging meter whose odometer readings are kept up to date.
        last_check:
          type: [string, 'null']
          format: date-time
        last_outcome:
          type: [string, 'null']
          description: What the last read said, in plain language.
        last_raw:
          type: [number, 'null']
          description: The odometer as Ford gave it, in `odometer_unit`.
        last_found:
          type: [string, 'null']
          description: Where in Ford's answer the odometer was found (like `metrics.odometer.value`), so it can be checked.
        last_miles:
          type: [number, 'null']
          description: The odometer in miles, as saved.
        last_day:
          type: [string, 'null']
          description: The local day the reading was saved for.
        read_wait_seconds:
          type: integer
          minimum: 1
          description: Seconds until Ford may be asked again (it allows one look every 30 seconds, and the server refuses a look inside that time with 429). Left out when it may be asked now.
        last_signals:
          type: array
          description: What the last answer held, so the field that has a figure can be found. Only the battery, charging, plug, range, energy and odometer members have a value; where the vehicle is and its identity are not copied.
          items:
            type: object
            required: [path, kind]
            properties:
              path:
                type: string
              kind:
                type: string
                enum: [number, string, boolean, 'null']
              value:
                type: string
    FordProbe:
      type: object
      required: [checked_at, results]
      properties:
        checked_at:
          type: [string, 'null']
          format: date-time
        results:
          type: array
          items:
            type: object
            required: [endpoint, status, ok]
            properties:
              endpoint:
                type: string
                description: The endpoint's name, like `electric/charge-schedules`.
              status:
                type: integer
                description: The HTTP status Ford answered; 0 when it was not asked or not reached (`message` says why).
              ok:
                type: boolean
              message:
                type: string
                description: What Ford said when it did not answer with data.
              signals:
                type: array
                items:
                  type: object
                  required: [path, kind]
                  properties:
                    path:
                      type: string
                    kind:
                      type: string
                      enum: [number, string, boolean, 'null']
                    value:
                      type: string
    FordUpdate:
      type: object
      required: [client_id, authorize_url, token_url, odometer_unit, meter_id]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
          description: Required the first time; omit to keep the saved one.
        authorize_url:
          type: string
          description: The account-linking address from the developer dashboard (View oAuth URLs). It has the client ID and the registered redirect address; its state is replaced.
        token_url:
          type: string
          description: Where the code and the refresh token are exchanged (the B2C code exchange of Ford's Postman collection). https, a name rather than an IP address.
        odometer_unit:
          type: string
          enum: [km, miles]
        meter_id:
          type: string
          description: A meter marked as charging an electric vehicle.
    FordLinkStart:
      type: object
      required: [url, redirect_uri]
      properties:
        url:
          type: string
          description: Open this to sign in at Ford and agree.
        redirect_uri:
          type: string
          description: Where Ford sends the browser afterwards; the address to paste back starts with it.
    FordLinkComplete:
      type: object
      required: [redirect]
      properties:
        redirect:
          type: string
          description: The whole address the browser went to after the owner agreed (or just its query), with `code` and `state`.
    IngestScope:
      type: string
      description: The PC collector's own reading scopes, kept as they are in its code.
      enum: [component, breakdown, wall, peripheral]
    PcReading:
      type: object
      required: [name, scope, avg_watts, max_watts, samples]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        avg_watts:
          type: number
        max_watts:
          type: number
        samples:
          type: integer
          minimum: 1
          description: How many once-a-second readings the minute is made of.
    PcProgram:
      type: object
      required: [name, cpu_kwh, gpu_kwh]
      description: |
        The estimated energy one program used in one minute, split into the CPU's and the GPU's share. An estimate: the
        PC shares only the power above its idle baseline, by each program's share of CPU and GPU busy time. Never added to
        the sensor or wall figures.
      properties:
        name:
          type: string
          description: A short label such as `chrome.exe` or `python.exe (ComfyUI)`; never a command line.
        cpu_kwh:
          type: number
          minimum: 0
        gpu_kwh:
          type: number
          minimum: 0
        active_seconds:
          type: number
          minimum: 0
          description: How long the program was busy in the minute.
    PcLiveReading:
      type: object
      required: [name, scope, watts]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        watts:
          type: number
          minimum: 0
    PcLiveProgram:
      type: object
      required: [name, cpu_watts, gpu_watts]
      description: What one program is estimated to be causing right now. An estimate, never a measurement.
      properties:
        name:
          type: string
        cpu_watts:
          type: number
          minimum: 0
        gpu_watts:
          type: number
          minimum: 0
    PcLive:
      type: object
      required: [at]
      description: |
        The PC's readings as of its last look, sent every few seconds while the collector is running (the newest one replaces the
        last). It is not history: the minutes are. A client shows how old it is and treats a stale one as "not answering".
      properties:
        at:
          type: string
          format: date-time
          description: When the PC took these readings.
        readings:
          type: array
          items:
            $ref: '#/components/schemas/PcLiveReading'
        programs:
          type: array
          description: Biggest first.
          items:
            $ref: '#/components/schemas/PcLiveProgram'
        notes:
          type: array
          description: Plain-language things the PC wants to say (a sensor that dropped out, an impossible reading it ignored).
          items:
            type: string
        idle_cpu_watts:
          type: [number, 'null']
          description: The idle baseline the per-program estimate shares power above. The lowest quiet 30-second average seen so far.
        idle_gpu_watts:
          type: [number, 'null']
        age_seconds:
          type: number
          minimum: 0
          description: "Set by the server when the dashboard reads it. How long ago the server received this, by its own clock (the PC's clock is not trusted for it). Not part of a push."
    PcRun:
      type: object
      required: [name, start, end, cpu_kwh, gpu_kwh, active_seconds, still_running]
      description: |
        What a program is estimated to have caused from when it started until it closed (a program with several processes counts as
        one run). An estimate.
      properties:
        name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        cpu_kwh:
          type: number
          minimum: 0
        gpu_kwh:
          type: number
          minimum: 0
        active_seconds:
          type: number
          minimum: 0
        still_running:
          type: boolean
        cost:
          type: [string, 'null']
          description: A money string, the run's energy at the price on the day it ended; null when no price is known. In a push this is not sent (the server prices it).
    PcSeriesLine:
      type: object
      required: [name, scope, kind, points]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [component, wall, peripheral]
        kind:
          type: string
          enum: [cpu, gpu, other]
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    PcSeries:
      type: object
      required: [bucket, lines, gaps]
      properties:
        bucket:
          $ref: '#/components/schemas/Bucket'
        lines:
          type: array
          description: The wall line first, then the sensors, then the meters. Never added together.
          items:
            $ref: '#/components/schemas/PcSeriesLine'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/PcGap'
    PcHistoryPeriod:
      type: object
      required: [key, label, from, to, kwh, basis, sensors_kwh, asleep_seconds, off_seconds, lost_power_seconds, plug_gap_kwh]
      properties:
        key:
          type: string
          enum: ['1h', '24h', '7d', '30d', '1y', all]
        label:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        kwh:
          type: number
          description: The whole PC at its wall plug when it has one (basis wall), else what its sensors measured (basis sensors).
        basis:
          type: string
          enum: [wall, sensors]
        cost:
          type: [string, 'null']
          description: A money string; null when no price is known.
        cost_estimated:
          type: boolean
          description: True when the price rests on a stand-in (a day outside any bill) or, with sensors only, on the period's average price.
        sensors_kwh:
          type: number
          description: What the CPU, GPU and memory sensors measured. Part of the whole PC, never added to it.
        asleep_seconds:
          type: number
        off_seconds:
          type: number
        lost_power_seconds:
          type: number
        plug_gap_kwh:
          type: number
          description: |
            Energy the PC's collector read from its plug's own counter across gaps. Informational: the server reads the plug itself all the time, so the
            time the PC slept is already in kwh and this is not added to it.
    ComputerHistory:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PcHistoryPeriod'
    AverageUse:
      type: object
      required: [kwh, days, kwh_per_day, average_watts, whole_pc, includes_pc, from, peripheral_count]
      properties:
        kwh:
          type: number
        days:
          type: number
          description: The time actually recorded in the window, in days.
        kwh_per_day:
          type: number
        average_watts:
          type: number
          description: kwh_per_day as a steady draw, counting the time it was off or asleep.
        whole_pc:
          type: boolean
          description: True when the figure is the whole PC at the wall, false when it is only what the sensors measured.
        includes_pc:
          type: boolean
          description: False when only the plugs next to the computer were counted.
        from:
          type: string
          format: date-time
        peripheral_count:
          type: integer
          description: How many plugs next to the computer were added.
    ComputerEstimate:
      type: object
      required: [rate, rate_estimated, currency, usage]
      properties:
        rate:
          type: [string, 'null']
          description: Today's price per kWh as a money string; null when none is known.
        rate_estimated:
          type: boolean
        currency:
          type: string
        usage:
          oneOf:
            - $ref: '#/components/schemas/AverageUse'
            - type: 'null'
    PcGap:
      type: object
      required: [from, to, reason]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
          type: string
          enum: [asleep, off, lost_power]
        plug_kwh:
          type: [number, 'null']
          description: Energy the wall plug's own counter recorded across the gap, when it could be read.
    PcMinute:
      type: object
      required: [minute, readings]
      properties:
        minute:
          type: string
          format: date-time
          description: The start of the minute, on a whole minute, in UTC.
        readings:
          type: array
          items:
            $ref: '#/components/schemas/PcReading'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/PcProgram'
        total_peak_watts:
          type: [number, 'null']
          description: The highest once-a-second reading of the sensors' total in the minute.
    PcIngest:
      type: object
      required: [api_version, source_id, minutes]
      properties:
        api_version:
          type: integer
          const: 1
        source_id:
          type: string
          description: A stable id for this PC, kept in its settings.
        source_name:
          type: string
        minutes:
          type: array
          maxItems: 1440
          items:
            $ref: '#/components/schemas/PcMinute'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/PcGap'
        live:
          $ref: '#/components/schemas/PcLive'
        runs:
          type: array
          maxItems: 200
          description: The PC's recent program runs. Sending one again replaces it (a run still going grows).
          items:
            $ref: '#/components/schemas/PcRun'
    ApplianceGroup:
      type: object
      required: [id, name, meter_ids]
      properties:
        id:
          type: string
        name:
          type: string
        meter_ids:
          type: array
          items:
            type: string
    NewGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    GroupDetail:
      type: object
      required: [group, from, to, members, total_kwh, cost_estimated, not_added]
      properties:
        group:
          $ref: '#/components/schemas/ApplianceGroup'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        members:
          type: array
          description: Each member that is shown (not hidden), with its own energy and cost.
          items:
            $ref: '#/components/schemas/MeterSummary'
        total_kwh:
          type: number
          description: |
            The members' energy added together, except any in `not_added`: a member that another member already contains (a plug on a
            circuit that is in the same group) is already in that one's reading, so it is not added a second time.
        total_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        cost_estimated:
          type: boolean
        not_added:
          type: array
          description: The ids of the members left out of the total because another member already contains them.
          items:
            type: string
    Computer:
      type: object
      required: [id, name, peripheral_meter_ids]
      properties:
        id:
          type: string
        name:
          type: string
        source_id:
          type: [string, 'null']
          description: The PC collector that reports for this computer, or null when none does.
        wall_meter_id:
          type: [string, 'null']
          description: The plug the computer is on, measuring the whole PC at the wall (scope `pc`).
        peripheral_meter_ids:
          type: array
          description: Plugs next to the computer (monitor, speakers), each a separate device.
          items:
            type: string
        last_seen:
          type: [string, 'null']
          format: date-time
          description: When its collector last sent anything.
    NewComputer:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        source_id:
          type: [string, 'null']
    ComputerUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        source_id:
          type: [string, 'null']
          description: The collector to take readings from, or null to stop using one.
    ComputerDetail:
      type: object
      required: [computer, from, to, peripherals, cost_estimated]
      properties:
        computer:
          $ref: '#/components/schemas/Computer'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        wall:
          oneOf:
            - $ref: '#/components/schemas/MeterSummary'
            - type: 'null'
          description: The whole PC at the wall, from its plug.
        peripherals:
          type: array
          items:
            $ref: '#/components/schemas/MeterSummary'
        setup_kwh:
          type: [number, 'null']
          description: The wall figure plus the peripherals, for the whole desk. A separate figure, never part of the PC's own.
        setup_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        cost_estimated:
          type: boolean
        pc:
          oneOf:
            - $ref: '#/components/schemas/PcSource'
            - type: 'null'
          description: What the PC's own collector reported; null when none reports for this computer.
    PcComponent:
      type: object
      required: [name, scope, kwh]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        kwh:
          type: number
        avg_watts:
          type: [number, 'null']
        peak_watts:
          type: [number, 'null']
        monitored_hours:
          type: number
    PcProgramTotal:
      type: object
      required: [name, cpu_kwh, gpu_kwh, kwh]
      properties:
        name:
          type: string
        cpu_kwh:
          type: number
        gpu_kwh:
          type: number
        kwh:
          type: number
          description: cpu_kwh plus gpu_kwh. An estimate.
        active_seconds:
          type: number
        cost:
          type: [string, 'null']
          description: A money string, the program's energy at the period's average price per kWh; null when no price is known. An estimate.
    PcSource:
      type: object
      required: [source_id, components, programs, gaps]
      properties:
        source_id:
          type: string
        name:
          type: string
        last_seen:
          type: [string, 'null']
          format: date-time
          description: When this PC last sent anything.
        total_peak_watts:
          type: [number, 'null']
          description: The highest once-a-second reading of the PC's sensors in total during the period.
        components:
          type: array
          items:
            $ref: '#/components/schemas/PcComponent'
        programs:
          type: array
          description: Biggest first. Estimates.
          items:
            $ref: '#/components/schemas/PcProgramTotal'
        gaps:
          type: array
          description: Stretches the PC was not sampling (asleep, off, lost power), clipped to the period.
          items:
            $ref: '#/components/schemas/PcGap'
        carbon_g:
          type: [number, 'null']
          description: The carbon of what the PC's sensors measured over the period, like a meter's carbon_g.
        carbon_estimated_kwh:
          type: [number, 'null']
        live:
          oneOf:
            - $ref: '#/components/schemas/PcLive'
            - type: 'null'
          description: The PC's latest readings, or null when it has not sent any.
        runs:
          type: array
          description: Program runs that overlapped the period, still-running first, then newest.
          items:
            $ref: '#/components/schemas/PcRun'
    IngestResult:
      type: object
      required: [api_version, accepted]
      properties:
        api_version:
          type: integer
          const: 1
        accepted:
          type: integer
          description: How many minutes were stored (new or replaced).
        notes:
          type: array
          items:
            type: string

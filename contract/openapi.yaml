openapi: 3.1.0
info:
  title: KVGuzzler house API
  version: 1.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: |
    The API of the always-on house server (`server/`, Go): whole-house and per-circuit power from the Refoss
    clamp monitors, smart plugs, and the PC pushed in by the KVGuzzler collector. The web dashboard (`web/`) and the
    Electron viewer (`shell/`) are its clients; the C# PC collector uses `POST /api/v1/ingest/pc`.

    **Versioning.** The contract has an integer major version, `api_version` (currently 1), sent by the server in the
    `X-KVG-Api-Version` header and in `GET /api/v1/status`, and by the PC collector in its ingest body. A client that
    sees a different major must stop and say which side needs updating. Adding optional fields or endpoints does not
    change the major; removing or re-typing anything does.

    **Rules every reading follows** (they mirror KVGuzzler's CLAUDE.md):
    - Everything about a device is read-only. This API never switches or configures a physical device.
    - Scopes are never summed across each other. `mains` is the whole house, `circuit` and `plug` are parts of it, and
      `pc` is the PC's own wall plug, which is a slice of some circuit already counted. Only readings of one scope
      are ever added together, and `house_watts` is the sum of the `mains` channels alone.
    - Money is a decimal string (`"12.34"`), never a number. Dates and times are RFC 3339 in UTC; "day" buckets and
      bill dates use the server's configured local time zone.
    - A reading above the sanity cap for its channel is dropped, not averaged; the drop is reported in `notes`.
servers:
  - url: http://house-box:8080
    description: The house server (host name and port are chosen at install time).
tags:
  - name: Read
    description: Current and historical readings, for the dashboard and the viewer.
  - name: Settings
    description: The server's own configuration (labels, devices, rates, carbon). Never changes a physical device.
  - name: Ingest
    description: Data pushed in by the PC collector.
security: []
paths:
  /api/v1/status:
    get:
      tags: [Read]
      operationId: getStatus
      summary: Server identity, versions and anything that needs attention.
      responses:
        '200':
          description: OK
          headers:
            X-KVG-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/devices:
    get:
      tags: [Read]
      operationId: listDevices
      summary: Every configured device and whether it answered recently.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
    post:
      tags: [Settings]
      operationId: addDevice
      summary: Start polling a device. Only a plain host or IP is accepted, never a URL or path.
      description: |
        The device is read once before anything is saved: one that does not answer like the kind named is refused with 502
        and nothing is kept. Adding a Refoss monitor answers 501 until its readings are mapped from a real answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDevice'
      responses:
        '201':
          description: Created. The server has already read the device once to learn its channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: That device is already being polled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: This kind of device is not supported yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: The device did not answer or did not look like the kind named.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/devices/{deviceId}:
    delete:
      tags: [Settings]
      operationId: removeDevice
      summary: Stop polling a device. Its history is kept, it is just no longer counted live.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/channels:
    get:
      tags: [Read]
      operationId: listChannels
      summary: Every channel (a circuit, a mains leg, a plug, the PC) with its label.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/v1/channels/{channelId}:
    patch:
      tags: [Settings]
      operationId: updateChannel
      summary: Rename a channel or switch it off. Changes only the server's own label, never the device.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      responses:
        '200':
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/live:
    get:
      tags: [Read]
      operationId: getLive
      summary: The latest reading of every enabled channel.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /api/v1/series:
    get:
      tags: [Read]
      operationId: getSeries
      summary: A channel's power over a period, bucketed.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: channel_id
          in: query
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          required: false
          description: Defaults to the coarsest bucket that keeps the period under about 400 points.
          schema:
            $ref: '#/components/schemas/Bucket'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/summary:
    get:
      tags: [Read]
      operationId: getSummary
      summary: Energy, cost and carbon per channel for a period, plus the house total.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/computers:
    get:
      tags: [Read]
      operationId: listComputers
      summary: Every computer, with the plugs tied to it.
      description: |
        A computer is its own kind of appliance: it can have a collector on it that reports its sensors and programs, one
        wall plug (the whole PC at the wall) and any number of peripheral plugs (monitor, speakers).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [computers]
                properties:
                  computers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Computer'
    post:
      tags: [Settings]
      operationId: addComputer
      summary: Add a computer by hand. A PC collector that reports for the first time is added by the server itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComputer'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computer'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another computer already uses that collector.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/computers/{computerId}:
    patch:
      tags: [Settings]
      operationId: updateComputer
      summary: Rename a computer or change which collector reports for it.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerUpdate'
      responses:
        '200':
          description: The updated computer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computer'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Another computer already uses that collector.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Settings]
      operationId: removeComputer
      summary: Remove a computer. Its plugs stay as ordinary plugs; what its collector reported is kept.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/detail:
    get:
      tags: [Read]
      operationId: getComputerDetail
      summary: Everything about one computer for a period.
      description: |
        The whole PC at the wall, its peripherals, and what its collector reported about its insides (sensors, the programs it
        blames, the times it was not recording). The PC is on one of the circuits, so none of this is added to the house or
        circuit figures. "Setup" is the wall figure plus the peripherals, a separate, labelled figure for the whole desk.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/computers/{computerId}/live:
    get:
      tags: [Read]
      operationId: getComputerLive
      summary: The latest look a computer's collector sent.
      description: |
        Just the PC's latest readings and per-program power, small enough to ask for every few seconds (the detail answer re-reads a whole
        period). 204 when no collector reports for this computer or none has sent a look yet.
      parameters:
        - $ref: '#/components/parameters/ComputerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PcLive'
        '204':
          description: No collector reports for this computer, or none has sent a look yet.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/groups:
    get:
      tags: [Read]
      operationId: listGroups
      summary: Every appliance group, with its plugs.
      description: |
        A group is several plugs shown as one appliance, for something that runs through more than one (an entertainment center on
        two power strips). It only changes how they are shown: each plug still records its own energy.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplianceGroup'
    post:
      tags: [Settings]
      operationId: addGroup
      summary: Add an empty group. Put plugs in it with PATCH /channels/{id} group_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplianceGroup'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/groups/{groupId}:
    patch:
      tags: [Settings]
      operationId: renameGroup
      summary: Rename a group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplianceGroup'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Settings]
      operationId: removeGroup
      summary: Remove a group. Its plugs stay, as ordinary plugs.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/groups/{groupId}/detail:
    get:
      tags: [Read]
      operationId: getGroupDetail
      summary: A group's energy and cost for a period, as one figure and by plug.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/rates:
    get:
      tags: [Settings]
      operationId: getRates
      summary: How the price of a kWh is worked out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateConfig'
    put:
      tags: [Settings]
      operationId: setRates
      summary: Replace the rate settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateConfig'
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateConfig'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon:
    get:
      tags: [Settings]
      operationId: getCarbon
      summary: Carbon-footprint settings and the last outcome of the grid-intensity fetch. Never returns the key.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonConfig'
    put:
      tags: [Settings]
      operationId: setCarbon
      summary: Save the place and, optionally, a new key. The key is write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarbonUpdate'
      responses:
        '200':
          description: The saved settings (without the key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonConfig'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/ingest/pc:
    post:
      tags: [Ingest]
      operationId: ingestPc
      summary: The PC collector pushes per-minute summaries. Safe to repeat.
      description: |
        Each reading is keyed by (`source_id`, `minute`, `name`); sending the same one again replaces it, so the
        collector can resend its whole outbox after a failure. Batches may arrive in any order.
        A body whose `api_version` differs from the server's is refused with 426.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PcIngest'
      responses:
        '200':
          description: Stored.
          headers:
            X-KVG-Api-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/Problem'
        '426':
          description: The collector and the server speak different major versions of this contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  headers:
    ApiVersion:
      description: The contract's major version the server speaks.
      schema:
        type: integer
        const: 1
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ComputerId:
      name: computerId
      in: path
      required: true
      schema:
        type: string
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      description: Start of the period (inclusive), RFC 3339.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: End of the period (exclusive), RFC 3339.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: The request was refused; the body says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A short stable name, for example `host_not_plain`, `api_version_mismatch`.
        message:
          type: string
        server_api_version:
          type: integer
          description: Present on a version mismatch.
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,6})?$'
      description: An exact decimal amount in the configured currency.
    Scope:
      type: string
      description: |
        What a channel measures. Scopes are never summed across each other.
        `mains` is the whole house (one per measured leg; the house is their sum), `circuit` is one breaker, `plug` is one
        appliance on a smart plug, `pc` is the PC's own wall plug and is a slice of a circuit, never added to anything.
      enum: [mains, circuit, plug, pc]
    Bucket:
      type: string
      enum: [minute, hour, day]
    Status:
      type: object
      required: [api_version, server_version, time, notes]
      properties:
        api_version:
          type: integer
          const: 1
        server_version:
          type: string
        time:
          type: string
          format: date-time
        time_zone:
          type: string
          description: The IANA zone used for "day" buckets and bill dates.
        notes:
          type: array
          description: Plain-language things that need attention (a device stopped answering, a reading dropped).
          items:
            type: string
    NewDevice:
      type: object
      required: [kind, host]
      properties:
        kind:
          type: string
          enum: [refoss, shelly_plug]
        host:
          type: string
          description: A plain host name or IP address only; a URL, path or port is refused.
        name:
          type: string
          maxLength: 60
          description: A label for the device (a plug's reading is named after this).
        scope:
          type: string
          enum: [plug, pc]
          default: plug
          description: |
            What a plug measures: `plug` is one appliance, `pc` is the PC's own wall plug. The PC's figure is a slice of a
            circuit already counted, so it is shown beside the others and added to nothing. Ignored for a Refoss monitor,
            whose channels say what they are.
    Device:
      type: object
      required: [id, kind, host, online]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [refoss, shelly_plug, pc]
        host:
          type: string
          description: Empty for `pc`, which pushes instead of being polled.
        name:
          type: string
        model:
          type: string
          description: As the device reports it, for example `em06p`.
        online:
          type: boolean
        last_seen:
          type: [string, 'null']
          format: date-time
    Channel:
      type: object
      required: [id, device_id, scope, label, enabled]
      properties:
        id:
          type: string
          description: Stable, and never contains a slash (it is used as a URL path segment), for example `refoss-em16p-1:ch-07`.
          pattern: '^[^/\s]+$'
        device_id:
          type: string
        index:
          type: [integer, 'null']
          description: The channel number on the device, when it has one.
        scope:
          $ref: '#/components/schemas/Scope'
        label:
          type: string
          description: What the user calls it, for example "Dryer" or "EV charger".
        enabled:
          type: boolean
          description: A switched-off channel is not shown or counted but its history is kept.
        max_watts:
          type: [number, 'null']
          description: The sanity cap; a reading above it is dropped.
        computer_id:
          type: [string, 'null']
          description: The computer this plug belongs to, or null. Only `pc` and `plug` channels can belong to one.
        group_id:
          type: [string, 'null']
          description: The appliance group this plug is part of, or null. Only an ordinary `plug` channel can be in a group, and not one that belongs to a computer.
    ChannelUpdate:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        enabled:
          type: boolean
        computer_id:
          type: [string, 'null']
          description: |
            Tie the plug to a computer (its id), or null to let it go. A computer has at most one `pc` plug (its wall plug);
            any number of `plug` channels are its peripherals.
        group_id:
          type: [string, 'null']
          description: |
            Put the plug in an appliance group (its id), or null to take it out. A plug is shown in one place: it cannot be in a
            group and belong to a computer (409).
    Reading:
      type: object
      required: [channel_id, watts]
      properties:
        channel_id:
          type: string
        watts:
          type: number
        volts:
          type: [number, 'null']
        amps:
          type: [number, 'null']
    Live:
      type: object
      required: [time, readings, house_watts, notes]
      properties:
        time:
          type: string
          format: date-time
        readings:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        house_watts:
          type: [number, 'null']
          description: The sum of the `mains` readings only; null when no mains channel answered.
        notes:
          type: array
          items:
            type: string
    SeriesPoint:
      type: object
      required: [t, avg_watts, max_watts, kwh]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the bucket.
        avg_watts:
          type: number
        max_watts:
          type: number
        kwh:
          type: number
    Series:
      type: object
      required: [channel_id, bucket, points]
      properties:
        channel_id:
          type: string
        bucket:
          $ref: '#/components/schemas/Bucket'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    ChannelSummary:
      type: object
      required: [channel_id, scope, kwh]
      properties:
        channel_id:
          type: string
        computer_id:
          type: [string, 'null']
          description: The computer the channel belongs to, so a client can group it with that computer instead of listing it alone.
        group_id:
          type: [string, 'null']
          description: The appliance group the channel is part of, so a client can list the group once instead of each plug.
        scope:
          $ref: '#/components/schemas/Scope'
        kwh:
          type: number
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        carbon_g:
          type: [number, 'null']
          description: Grams of CO2e, an average-grid estimate (always shown as approximate).
        peak_watts:
          type: [number, 'null']
        monitored_hours:
          type: number
          description: Hours inside the period in which this channel actually reported.
    Summary:
      type: object
      required: [from, to, channels, house_kwh]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelSummary'
        house_kwh:
          type: [number, 'null']
          description: Energy of the `mains` channels only; null when there is none.
        house_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        unmetered_kwh:
          type: [number, 'null']
          description: |
            `house_kwh` minus the energy of the enabled `circuit` channels, never below zero: what no circuit
            clamp accounts for. Derived, so shown as its own row and never added to anything.
        cost_estimated:
          type: boolean
          description: |
            True when any part of a cost in this summary was priced by estimate: a day after the latest bill or in a gap
            between bills uses the most recent bill's price until the next bill is entered. Show such costs as approximate.
        carbon_estimated_share:
          type: [number, 'null']
          description: The share (0 to 1) of the carbon figure that rests on an estimated, not measured, grid intensity.
    RateMode:
      type: string
      enum: [one, bills, lookup]
    FixedFee:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
          maxLength: 60
        amount:
          $ref: '#/components/schemas/Money'
    Bill:
      type: object
      required: [start, end, total, kwh]
      properties:
        start:
          type: string
          format: date
          description: First local day the bill covers.
        end:
          type: string
          format: date
          description: Last local day the bill covers. Two bills may not share a day.
        total:
          $ref: '#/components/schemas/Money'
        fixed_fees:
          type: array
          description: |
            Charges on the bill that do not depend on use (a basic service charge, a credit as a negative amount). They are
            left out when the price per kWh is worked out: (total minus these) / kwh.
          items:
            $ref: '#/components/schemas/FixedFee'
        kwh:
          type: number
          exclusiveMinimum: 0
    RateConfig:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/RateMode'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        fixed_rate:
          $ref: '#/components/schemas/Money'
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        tariff_label:
          type: [string, 'null']
          description: The looked-up tariff in use (lookup mode); the rate grid itself is kept server-side.
    CarbonConfig:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a key is saved. The key itself is never returned.
        place:
          type: string
          description: A zone code, or "lat, lon".
        last_outcome:
          type: [string, 'null']
          description: What the last fetch said, in plain language.
        last_fetch:
          type: [string, 'null']
          format: date-time
    CarbonUpdate:
      type: object
      properties:
        place:
          type: string
        key:
          type: string
          writeOnly: true
          description: Omit to keep the saved key.
    IngestScope:
      type: string
      description: The PC collector's own reading scopes, kept as they are in its code.
      enum: [component, breakdown, wall, peripheral]
    PcReading:
      type: object
      required: [name, scope, avg_watts, max_watts, samples]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        avg_watts:
          type: number
        max_watts:
          type: number
        samples:
          type: integer
          minimum: 1
          description: How many once-a-second readings the minute is made of.
    PcProgram:
      type: object
      required: [name, cpu_kwh, gpu_kwh]
      description: |
        The estimated energy one program used in one minute, split into the CPU's and the GPU's share. An estimate: the
        PC shares only the power above its idle baseline, by each program's share of CPU and GPU busy time. Never added to
        the sensor or wall figures.
      properties:
        name:
          type: string
          description: A short label such as `chrome.exe` or `python.exe (ComfyUI)`; never a command line.
        cpu_kwh:
          type: number
          minimum: 0
        gpu_kwh:
          type: number
          minimum: 0
        active_seconds:
          type: number
          minimum: 0
          description: How long the program was busy in the minute.
    PcLiveReading:
      type: object
      required: [name, scope, watts]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        watts:
          type: number
          minimum: 0
    PcLiveProgram:
      type: object
      required: [name, cpu_watts, gpu_watts]
      description: What one program is estimated to be causing right now. An estimate, never a measurement.
      properties:
        name:
          type: string
        cpu_watts:
          type: number
          minimum: 0
        gpu_watts:
          type: number
          minimum: 0
    PcLive:
      type: object
      required: [at]
      description: |
        The PC's readings as of its last look, sent every few seconds while the collector is running (the newest one replaces the
        last). It is not history: the minutes are. A client shows how old it is and treats a stale one as "not answering".
      properties:
        at:
          type: string
          format: date-time
          description: When the PC took these readings.
        readings:
          type: array
          items:
            $ref: '#/components/schemas/PcLiveReading'
        programs:
          type: array
          description: Biggest first.
          items:
            $ref: '#/components/schemas/PcLiveProgram'
        notes:
          type: array
          description: Plain-language things the PC wants to say (a sensor that dropped out, an impossible reading it ignored).
          items:
            type: string
        idle_cpu_watts:
          type: [number, 'null']
          description: The idle baseline the per-program estimate shares power above. The lowest quiet 30-second average seen so far.
        idle_gpu_watts:
          type: [number, 'null']
        age_seconds:
          type: number
          minimum: 0
          description: "Set by the server when the dashboard reads it. How long ago the server received this, by its own clock (the PC's clock is not trusted for it). Not part of a push."
    PcRun:
      type: object
      required: [name, start, end, cpu_kwh, gpu_kwh, active_seconds, still_running]
      description: |
        What a program is estimated to have caused from when it started until it closed (a program with several processes counts as
        one run). An estimate.
      properties:
        name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        cpu_kwh:
          type: number
          minimum: 0
        gpu_kwh:
          type: number
          minimum: 0
        active_seconds:
          type: number
          minimum: 0
        still_running:
          type: boolean
    PcGap:
      type: object
      required: [from, to, reason]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
          type: string
          enum: [asleep, off, lost_power]
        plug_kwh:
          type: [number, 'null']
          description: Energy the wall plug's own counter recorded across the gap, when it could be read.
    PcMinute:
      type: object
      required: [minute, readings]
      properties:
        minute:
          type: string
          format: date-time
          description: The start of the minute, on a whole minute, in UTC.
        readings:
          type: array
          items:
            $ref: '#/components/schemas/PcReading'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/PcProgram'
        total_peak_watts:
          type: [number, 'null']
          description: The highest once-a-second reading of the sensors' total in the minute.
    PcIngest:
      type: object
      required: [api_version, source_id, minutes]
      properties:
        api_version:
          type: integer
          const: 1
        source_id:
          type: string
          description: A stable id for this PC, kept in its settings.
        source_name:
          type: string
        minutes:
          type: array
          maxItems: 1440
          items:
            $ref: '#/components/schemas/PcMinute'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/PcGap'
        live:
          $ref: '#/components/schemas/PcLive'
        runs:
          type: array
          maxItems: 200
          description: The PC's recent program runs. Sending one again replaces it (a run still going grows).
          items:
            $ref: '#/components/schemas/PcRun'
    ApplianceGroup:
      type: object
      required: [id, name, channel_ids]
      properties:
        id:
          type: string
        name:
          type: string
        channel_ids:
          type: array
          items:
            type: string
    NewGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    GroupDetail:
      type: object
      required: [group, from, to, members, total_kwh, cost_estimated]
      properties:
        group:
          $ref: '#/components/schemas/ApplianceGroup'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        members:
          type: array
          description: Each plug that is shown (not hidden), with its own energy and cost.
          items:
            $ref: '#/components/schemas/ChannelSummary'
        total_kwh:
          type: number
          description: The plugs' energy added together (all are ordinary plugs, so adding them is sound).
        total_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        cost_estimated:
          type: boolean
    Computer:
      type: object
      required: [id, name, peripheral_channel_ids]
      properties:
        id:
          type: string
        name:
          type: string
        source_id:
          type: [string, 'null']
          description: The PC collector that reports for this computer, or null when none does.
        wall_channel_id:
          type: [string, 'null']
          description: The plug the computer is on, measuring the whole PC at the wall (scope `pc`).
        peripheral_channel_ids:
          type: array
          description: Plugs next to the computer (monitor, speakers), each a separate device.
          items:
            type: string
        last_seen:
          type: [string, 'null']
          format: date-time
          description: When its collector last sent anything.
    NewComputer:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        source_id:
          type: [string, 'null']
    ComputerUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        source_id:
          type: [string, 'null']
          description: The collector to take readings from, or null to stop using one.
    ComputerDetail:
      type: object
      required: [computer, from, to, peripherals, cost_estimated]
      properties:
        computer:
          $ref: '#/components/schemas/Computer'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        wall:
          oneOf:
            - $ref: '#/components/schemas/ChannelSummary'
            - type: 'null'
          description: The whole PC at the wall, from its plug.
        peripherals:
          type: array
          items:
            $ref: '#/components/schemas/ChannelSummary'
        setup_kwh:
          type: [number, 'null']
          description: The wall figure plus the peripherals, for the whole desk. A separate figure, never part of the PC's own.
        setup_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        cost_estimated:
          type: boolean
        pc:
          oneOf:
            - $ref: '#/components/schemas/PcSource'
            - type: 'null'
          description: What the PC's own collector reported; null when none reports for this computer.
    PcComponent:
      type: object
      required: [name, scope, kwh]
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/IngestScope'
        kind:
          type: string
          enum: [other, cpu, gpu]
        kwh:
          type: number
        avg_watts:
          type: [number, 'null']
        peak_watts:
          type: [number, 'null']
        monitored_hours:
          type: number
    PcProgramTotal:
      type: object
      required: [name, cpu_kwh, gpu_kwh, kwh]
      properties:
        name:
          type: string
        cpu_kwh:
          type: number
        gpu_kwh:
          type: number
        kwh:
          type: number
          description: cpu_kwh plus gpu_kwh. An estimate.
        active_seconds:
          type: number
    PcSource:
      type: object
      required: [source_id, components, programs, gaps]
      properties:
        source_id:
          type: string
        name:
          type: string
        last_seen:
          type: [string, 'null']
          format: date-time
          description: When this PC last sent anything.
        total_peak_watts:
          type: [number, 'null']
          description: The highest once-a-second reading of the PC's sensors in total during the period.
        components:
          type: array
          items:
            $ref: '#/components/schemas/PcComponent'
        programs:
          type: array
          description: Biggest first. Estimates.
          items:
            $ref: '#/components/schemas/PcProgramTotal'
        gaps:
          type: array
          description: Stretches the PC was not sampling (asleep, off, lost power), clipped to the period.
          items:
            $ref: '#/components/schemas/PcGap'
        live:
          oneOf:
            - $ref: '#/components/schemas/PcLive'
            - type: 'null'
          description: The PC's latest readings, or null when it has not sent any.
        runs:
          type: array
          description: Program runs that overlapped the period, still-running first, then newest.
          items:
            $ref: '#/components/schemas/PcRun'
    IngestResult:
      type: object
      required: [api_version, accepted]
      properties:
        api_version:
          type: integer
          const: 1
        accepted:
          type: integer
          description: How many minutes were stored (new or replaced).
        notes:
          type: array
          items:
            type: string

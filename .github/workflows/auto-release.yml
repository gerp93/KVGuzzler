# Fires a release on EVERY push to main (conventional-commit-driven version bump), calling
# KVG_Standards' release-avalonia.yml. Coexists with cut-release.yml, which releases a
# deliberately chosen version instead. Copied from KVG_Standards' templates/auto-release.yml.

name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    # KVG_Standards has no tags yet, so @main is the documented interim exception.
    uses: gerp93/KVG_Standards/.github/workflows/release-avalonia.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_name: KVGuzzler
      app_title: KVGuzzler
      project_path: src/KVGuzzler/KVGuzzler.csproj
      exe_name: KVGuzzler
      test_path: tests/KVGuzzler.Tests/KVGuzzler.Tests.csproj
      # icon_ico: assets/icon.ico   # once assets/logo.png exists: python scripts/generate-icons.py
      # icon_png: assets/icon.png
    permissions:
      contents: write

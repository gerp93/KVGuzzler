# Build, vet and test the Go house server. Only for changes to server/ and the contract it implements.
# The standard workflow (build + vet) is reused as it is; KVG_Standards' ci-go.yml does not run `go test`, so the
# tests, the format check and the Linux cross-build are the second job here.

name: CI (server)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - '.github/workflows/ci-server.yml'

jobs:
  standard:
    uses: gerp93/KVG_Standards/.github/workflows/ci-go.yml@main
    with:
      working_directory: server
      go_version: '1.25'

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Cross-build for the Linux server
        run: GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/housed

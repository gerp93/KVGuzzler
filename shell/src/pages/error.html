<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>House power</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; color: #fff; background: #0d47a1; }
      main { width: min(30rem, calc(100vw - 32px)); padding: 24px; background: #2a5dac; border: 1px solid #567ebd; border-radius: 8px; }
      h1 { margin: 0 0 8px; font-size: 1.3rem; }
      p { margin: 8px 0; color: #d6e0f2; }
      code { color: #fff; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      button { padding: 10px 18px; font: inherit; color: inherit; background: #46505a; border: 1px solid #567ebd; border-radius: 8px; cursor: pointer; }
      button:hover { background: #5a646e; }
      .small { font-size: 0.85rem; }
      :focus-visible { outline: 2px solid #96c8ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the house server</h1>
      <p>Nothing answered at <code id="address"></code>.</p>
      <p class="small" id="reason"></p>
      <p class="small">It may be switched off, restarting, or on another network. This page tries again by itself every 15 seconds.</p>
      <div class="row">
        <button id="retry" type="button">Try again</button>
        <button id="change" type="button">Change the address</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('address').textContent = (params.get('address') || 'the server').replace(/^http:\/\//, '');
      document.getElementById('reason').textContent = params.get('reason') ? 'The reason given: ' + params.get('reason') : '';
      document.getElementById('retry').addEventListener('click', () => window.viewer.retry());
      document.getElementById('change').addEventListener('click', () => window.viewer.changeServer());
      setInterval(() => window.viewer.retry(), 15000);
    </script>
  </body>
</html>
